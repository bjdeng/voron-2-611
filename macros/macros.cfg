# many useful macros referenced elsewhere. 
# most of these were taken from https://ellis3dp.com/Print-Tuning-Guide/articles/index_useful_macros.html
# some are directly from ellis' provile at https://github.com/AndrewEllis93/v2.247_backup_klipper_config/blob/master/macros.cfg

# Conditional G28 (home if not already homed)
[gcode_macro _CG28]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

# Conditional QGL (home if not already done)
[gcode_macro _CQGL]
gcode:
    {% if printer.quad_gantry_level.applied == False %}
        {% if "xyz" not in printer.toolhead.homed_axes %}
            G28 ; home if not already homed
        {% endif %}
        QUAD_GANTRY_LEVEL
        G28 Z
    {% endif %}
    
[gcode_macro OFF]
gcode:
    M84                                  ; turn steppers off
    TURN_OFF_HEATERS                     ; turn bed / hotend off
    M107                                 ; turn print cooling fan off
    set_temperature_fan_target temperature_fan=chamber target=0  ; turn exhaust fan off
    SET_FAN_SPEED FAN=BedFans SPEED=0   ; bed fan off
    SET_PIN PIN=caselight VALUE=0       ; turn case light off

[gcode_macro SHUTDOWN]
gcode:
    OFF
    {action_call_remote_method("shutdown_machine")}   ; Moonraker compatible

# Park front center
[gcode_macro PARKFRONT]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                           ; home if not already homed
    {% endif %}
    SAVE_GCODE_STATE NAME=PARKFRONT
    G90                               ; absolute positioning
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} Z{printer.toolhead.axis_maximum.z/2} F6000        
    RESTORE_GCODE_STATE NAME=PARKFRONT

# Park front center, but low down.
[gcode_macro PARKFRONTLOW]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                           ; home if not already homed
    {% endif %}
    SAVE_GCODE_STATE NAME=PARKFRONT
    G90                              ; absolute positioning
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} Z20 F6000                                     
    RESTORE_GCODE_STATE NAME=PARKFRONT

# Park top rear left
[gcode_macro PARKREAR]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                           ; home if not already homed
    {% endif %}
    SAVE_GCODE_STATE NAME=PARKREAR
    G90                              ; absolute positioning
    G0 X{printer.toolhead.axis_minimum.x+10} Y{printer.toolhead.axis_maximum.y-10} Z{printer.toolhead.axis_maximum.z-50} F6000     
    RESTORE_GCODE_STATE NAME=PARKREAR

[gcode_macro _RESETSPEEDS]
gcode:
    SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} 
    SET_VELOCITY_LIMIT ACCEL={printer.configfile.settings.printer.max_accel}  
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={printer.configfile.settings.printer.square_corner_velocity} 

# Park at center of build volume
[gcode_macro PARKCENTER]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                           ; home if not already homed
    {% endif %}
    SAVE_GCODE_STATE NAME=PARKCENTER
    G90                               ; absolute positioning
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} Z{printer.toolhead.axis_maximum.z/2} F6000    
    RESTORE_GCODE_STATE NAME=PARKCENTER

# Park 15mm above center of bed
[gcode_macro PARKBED]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                           ; home if not already homed
    {% endif %}
    SAVE_GCODE_STATE NAME=PARKBED
    G90                                ; absolute positioning
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} Z15 F6000                                     
    RESTORE_GCODE_STATE NAME=PARKBED

[gcode_macro M109]
rename_existing: M99109
gcode:
    #Parameters
    {% set s = params.S|float %}
    
    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  ; Set hotend temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} MAXIMUM={s+1}   ; Wait for hotend temp (within 1 degree)
    {% endif %}

[delayed_gcode DELAYED_OFF]
gcode:
    OFF ; call "OFF" macro, to turn off everything (heaters, motors, lights, fans)
    
[gcode_macro HEATSOAK]
gcode:
    # Parameters
    {% set t = params.T|default(110)|int %}
    {% set c = params.C|default(30)|int %}
    {% set move = params.MOVE|default(1)|int %}
    {% set wait = params.WAIT|default(0)|int %}

    SAVE_GCODE_STATE NAME=HEATSOAK
    UPDATE_DELAYED_GCODE ID=DELAYED_OFF DURATION=0    ; cancel off timer (if there is one)
    M140 S{t}                                         ; heat bed
    {% if move == 1 %}
        _CG28
        G90
        G0 Z{printer.toolhead.axis_maximum.z/2} F19500    
        G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} F19500    
    {% endif %}
    {% if c > 30 and wait == 1 %}
        TEMPERATURE_WAIT SENSOR="temperature_fan chamber" MINIMUM={c} ; wait for chamber temp
    {% endif %}
    RESTORE_GCODE_STATE NAME=HEATSOAK

[gcode_macro FIRST_LAYER_Z_TEST]
description: "Print first-layer test lines with different Z-offsets (with z-hop at 50mm/s and bidirectional printing) for optimal squish"
gcode:
    ## Initialize: Home, set absolute positioning, and reset the extruder.
    _CG28                              ; Home all axes
    _CQGL
    G90                              ; Use absolute positioning
    M83                              ; Set extruder to relative mode
    G92 E0                           ; Reset extruder distance

    ## Define parameters (override defaults as needed):
    {% set start_offset = params.START|default(0.0)|float %}
    {% set z_inc        = params.INC|default(0.025)|float %}
    {% set num_lines    = params.LINES|default(12)|int %}
    {% set start_x      = params.X|default(100)|float %}
    {% set start_y      = params.Y|default(0)|float %}
    {% set line_length  = params.LENGTH|default(100)|float %}
    
    ## First-layer and extrusion settings:
    {% set layer_height = 0.2 %}
    {% set line_width   = 0.5 %}
    {% set overlap      = 0.25 %}
    {% set filament_dia = 1.75 %}
    {% set extr_mult    = 0.98 %}
    {% set line_move    = line_width * (1-(0.5*overlap)) %}
    
    ## Speeds (mm/min):
    {% set print_speed  = 3000 %}    ; 50 mm/s (for printing moves and z-hop)
    {% set travel_speed = 21000 %}   ; 350 mm/s (for horizontal travel moves)
    
    ## Calculate extrusion amount:
    {% set vol = line_length * line_width * layer_height %}
    {% set filament_area = 3.14159 * ((filament_dia / 2) * (filament_dia / 2)) %}
    {% set E_value = (vol / filament_area) * extr_mult %}

    {% for i in range(num_lines) %}
        {% set current_offset = start_offset + (i * z_inc) %}
        # M117 "Line {i+1} offset: {'%0.3f' % current_offset}mm"
        SET_GCODE_OFFSET Z={'%0.3f' % current_offset}

        # {% if i % 2 == 0 %}
        #     {% set line_start = start_x %}
        #     {% set line_end = start_x + line_length %}
        # {% else %}
        #     {% set line_start = start_x + line_length %}
        #     {% set line_end = start_x %}
        # {% endif %}

        {% if i == 0 %}
            G1 X{start_x} Y{start_y} Z0.2 F{travel_speed}
        {% else %}
            G1 Z0.6 F{print_speed}                ; Z-hop at 50mm/s (print speed)
            G1 X{start_x} Y{start_y + (i * 2)} F{travel_speed}
            G1 Z0.2 F{travel_speed}
        {% endif %}

        G1 X{start_x + line_length} Y{start_y + (i * 2)} E{'%0.3f' % E_value} F{print_speed}
        G1 Y{start_y + (i * 2) + line_move} F{print_speed}
        G1 X{start_x} Y{start_y + (i * 2) + line_move} E{'%0.3f' % E_value} F{print_speed}
        
    {% endfor %}

    PAUSE

  # printer.cfg

[gcode_macro SET_ACTIVE_SPOOL]
gcode:
  {% if params.ID %}
    {% set id = params.ID|int %}
    {action_call_remote_method(
       "spoolman_set_active_spool",
       spool_id=id
    )}
  {% else %}
    {action_respond_info("Parameter 'ID' is required")}
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
gcode:
  {action_call_remote_method(
    "spoolman_set_active_spool",
    spool_id=None
  )}

