name: CI (docs-only no-op)

# Companion to ci.yml. The main CI workflow uses `paths-ignore` to skip the
# real test pipeline on docs-only changes (CLAUDE.md, memory/, docs/, etc.).
# When skipped, GitHub doesn't dispatch the job at all — which means branch
# protection's required check (`pre-commit + macro refcheck + pytest`) is
# never reported, and the PR is BLOCKED for merge.
#
# This workflow exists to satisfy that check on docs-only changes by
# reporting the exact same job name as a no-op success. It runs ONLY on
# paths that ci.yml ignores, so for any given push exactly one of the two
# workflows runs.

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'LICENSE'
      - 'memory/**'
      - 'docs/**'
      - '.claude/**'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'LICENSE'
      - 'memory/**'
      - 'docs/**'
      - '.claude/**'

jobs:
  lint-and-refcheck:
    name: pre-commit + macro refcheck + pytest
    runs-on: ubuntu-22.04
    steps:
      - name: Docs-only change — skip real CI
        run: |
          echo "::notice::Docs-only change. Real CI in ci.yml is skipped via paths-ignore."
          echo "::notice::This job reports success to satisfy the required-status-check rule."
