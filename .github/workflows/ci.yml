name: CI

on:
  pull_request:
    # Docs/memory/spec/plan changes don't affect config validity or Python
    # code, so skip CI for those — keeps free-tier minutes for changes that
    # could actually break the printer. A mixed PR (e.g. printer.cfg AND a
    # README) still triggers CI because GitHub fires the workflow when ANY
    # non-ignored path changed.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'memory/**'
      - 'docs/**'
      - '.claude/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'memory/**'
      - 'docs/**'
      - '.claude/**'
  # Manual trigger via `gh workflow run ci.yml`. Needed for the case where
  # a squash-merge to main only touches a path-filtered file (e.g. a yaml-only
  # config change) — GitHub doesn't fire path-filtered workflows for empty
  # diffs, so the deploy gate (which requires a CI run for HEAD) gets stuck.
  # `gh workflow run ci.yml --ref main` unblocks it.
  workflow_dispatch:

jobs:
  # Re-enabled 2026-05-15 after the eddy-ng → native [probe_eddy_current]
  # migration (PR #17). Scope is parse + MCU load only: we deliberately do
  # NOT execute gcode (see tests/voron-2-611.test for why). What this job
  # actually catches:
  #   • config syntax errors, unknown sections
  #   • pin clashes across MCUs
  #   • unsupported sensor types (the LPC1769 `temperature_mcu` trap)
  #   • jinja2 *parse* errors in macro bodies
  #
  # Failure modes worth knowing:
  #   • "Unknown command: trigger_analog_*" / "ldc1612_*" → tests/dict/eddy.dict
  #     is stale relative to the firmware on the Pi. Regenerate via
  #     `scp pi@mainsailos.local:~/klipper/out/klipper.dict tests/dict/eddy.dict`
  #     after a clean firmware build (see config/firmware/eddy.config).
  #
  # See memory/troubleshooting-log.md 2026-05-14 for the prior gating history.
  klippy-smoke:
    name: Klippy parse + MCU load
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Klipper's runtime deps (greenlet, cffi, jinja2, …)
        run: pip install -r vendor/klipper/scripts/klippy-requirements.txt -r vendor/klipper/scripts/tests-requirements.txt
      # Third-party Klipper extensions:
      #   • eddy-ng: PR #17 migrated to the native [probe_eddy_current] which
      #     lives in vanilla vendor/klipper/klippy/extras/. No symlink needed.
      #   • Happy-Hare: its includes are stripped in the next step, so
      #     Klipper never instantiates [mmu]/[mmu_machine]. No symlink needed.
      #   • klippain-shaketune: not vendored yet; section is stripped below.
      #   • klipper-tmc-autotune: vendored at vendor/klipper-tmc-autotune;
      #     symlinked into klippy/extras below.
      # If a future change re-introduces a third-party Klipper section that
      # isn't in vanilla Klipper, the install.sh / install.py from that
      # project documents the file set to symlink — add a step here.
      - name: Symlink TMC Autotune extension into vendor/klipper
        # klipper-tmc-autotune is a vendored submodule (Phase B of issue #24).
        # Its install.sh symlinks 3 files into ~/klipper/klippy/extras/ on the
        # Pi; mirror that here so klippy parse recognizes [autotune_tmc] sections.
        shell: bash
        run: |
          set -euo pipefail
          ln -sf "$GITHUB_WORKSPACE/vendor/klipper-tmc-autotune/autotune_tmc.py" vendor/klipper/klippy/extras/autotune_tmc.py
          ln -sf "$GITHUB_WORKSPACE/vendor/klipper-tmc-autotune/motor_constants.py" vendor/klipper/klippy/extras/motor_constants.py
          ln -sf "$GITHUB_WORKSPACE/vendor/klipper-tmc-autotune/motor_database.cfg" vendor/klipper/klippy/extras/motor_database.cfg
      - name: Strip [shaketune] from system.cfg (klippain-shaketune not vendored yet)
        # klippain-shaketune lives at ~/klippain_shaketune on the Pi with a
        # symlink into ~/klipper/klippy/extras/shaketune.py. Vendoring is
        # tracked as a follow-up — once that lands, replace this strip with
        # a real symlink step (matching the comment block above).
        # The [shaketune] block sits at the END of config/system.cfg under
        # the "Klippain Shake&Tune" banner. Strip from that banner to EOF.
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/^#   Klippain Shake&Tune$/,$d' config/system.cfg
          # The banner above the title is a "#####" line — also drop that
          # plus any trailing whitespace it leaves behind.
          sed -i -e :a -e '/^[#[:space:]]*$/{$d;N;ba' -e '}' config/system.cfg
          echo "Post-strip tail of system.cfg:"
          tail -10 config/system.cfg
      - name: Strip [include chopper_tune.cfg] from printer.cfg (chopper-resonance-tuner not vendored)
        # chopper_tune.cfg is a Pi-side symlink to ~/chopper-resonance-tuner/chopper_tune.cfg
        # (install.sh adds the include at the top of printer.cfg). Same install pattern as
        # klippain-shaketune — not vendored, so the target file doesn't exist under CI's
        # checkout. [respond] is left as-is (built-in Klipper section, parses fine).
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/^\[include chopper_tune\.cfg\]$/d' config/printer.cfg
          echo "Post-strip [include] lines in printer.cfg:"
          grep -n '^\[include' config/printer.cfg || true
      - name: Strip MMU includes from printer.cfg (Happy-Hare incompat)
        # Happy-Hare's mmu.py:_setup_logging is invoked at handle_connect
        # (load time, before any gcode) and crashes under test_klippy.py in
        # two independent ways:
        #   • bare-bracket `start_args['log_file']` lookup → KeyError when
        #     klippy.py runs without `-l` (mmu.py:733)
        #   • `if dirname is None:` check after os.path.dirname(), which
        #     returns '' (never None) → mmu_log = '' + '/mmu.log' = '/mmu.log'
        #     → PermissionError on filesystem root (mmu.py:735-738)
        # Both patterns have lived in HH `main` since 2023-10-02 with zero
        # upstream reports — HH has never been tested under test_klippy.
        # Strip the four `[include mmu/...]` lines from printer.cfg so the
        # rest of the config (pin clashes across the 4 non-MMU MCUs, sensor
        # validity, jinja parse, the LPC1769 temperature_mcu trap) is still
        # validated. MMU load + runtime is L6's job (post-deploy smoke).
        # If HH ever happens to fix the pattern (we'd notice at vendor bump
        # time), this strip can go and L3 picks up MMU coverage for free.
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/^\[include mmu\//d' config/printer.cfg
          echo "Post-strip [include] lines in printer.cfg:"
          grep -n '^\[include' config/printer.cfg || true
      - name: Run test_klippy.py against tests/voron-2-611.test
        # `shell: bash` enables `-eo pipefail` by default. Without it,
        # GitHub Actions runs `bash -e {0}` (no pipefail), so `tee`'s
        # exit code (0) would mask a non-zero from test_klippy.py and
        # the job would falsely report green. Codex P1.
        shell: bash
        working-directory: vendor/klipper
        run: |
          python scripts/test_klippy.py -d ../../tests/dict ../../tests/voron-2-611.test 2>&1 | tee klippy-test.log
      - name: Upload klippy log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: klippy-test-log
          path: |
            vendor/klipper/klippy-test.log
            vendor/klipper/_test_.log
            vendor/klipper/_test_output*
          if-no-files-found: ignore

  lint-and-refcheck:
    name: pre-commit + macro refcheck + pytest
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install tooling deps
        run: pip install -r requirements.txt
      - name: pre-commit (text hygiene + ruff)
        run: pre-commit run --all-files
      - name: Unit tests (pytest)
        run: python -m pytest tests/ -v
      - name: macro_refcheck against all .cfg files
        # failglob: bash exits nonzero if any glob matches nothing — catches
        # accidental directory renames / restructures that would otherwise
        # silently shrink coverage. `shell: bash` for `-eo pipefail` consistency.
        shell: bash
        run: |
          shopt -s failglob
          python scripts/macro_refcheck.py \
            config/*.cfg \
            config/macros/*.cfg config/mmu/base/*.cfg config/mmu/addons/*.cfg config/mmu/optional/*.cfg
