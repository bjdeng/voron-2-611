name: CI

on:
  pull_request:
    # Docs/memory/spec/plan changes don't affect config validity or Python
    # code, so skip CI for those — keeps free-tier minutes for changes that
    # could actually break the printer. A mixed PR (e.g. printer.cfg AND a
    # README) still triggers CI because GitHub fires the workflow when ANY
    # non-ignored path changed.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'memory/**'
      - 'docs/**'
      - '.claude/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'memory/**'
      - 'docs/**'
      - '.claude/**'

jobs:
  # DISABLED until the eddy migration removes [probe_eddy_ng] from eddy.cfg.
  #
  # The committed tests/dict/eddy.dict was built on the Pi without eddy-ng's
  # sensor_ldc1612_ng.c firmware patch applied, so the MCU command table is
  # missing `ldc1612_ng_*` commands that vendor/eddy-ng/ldc1612_ng.py
  # hardcodes calls to. Pipefail (added in d9f53f4 per Codex P1) unmasked
  # this — previous "green" CI runs were hiding the failure via the `tee`
  # pipe swallowing test_klippy's exit code.
  #
  # The eddy migration (docs/superpowers/plans/2026-05-13-eddy-ng-to-native-migration.md)
  # replaces [probe_eddy_ng] with the native [probe_eddy_current], which uses
  # vanilla `ldc1612_*` MCU commands that ARE present in eddy.dict. When that
  # PR lands, re-enable this job by removing the `if: false` line below.
  #
  # See memory/troubleshooting-log.md 2026-05-14 for the full history of this
  # job's "now you see it, now you don't" failures.
  klippy-smoke:
    if: false
    name: Klippy parse + smoke gcode (disabled until eddy-ng → native migration)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Klipper's runtime deps (greenlet, cffi, jinja2, …)
        run: pip install -r vendor/klipper/scripts/klippy-requirements.txt -r vendor/klipper/scripts/tests-requirements.txt
      - name: Pre-create paths referenced by config (Happy-Hare save_variables, etc.)
        # printer.cfg references files at ~/printer_data/config/mmu/mmu_vars.cfg
        # (via Happy-Hare's [save_variables] in mmu/base/mmu_macro_vars.cfg).
        # save_variables.py does open(path, 'w') which won't create parents.
        # On a real Pi those paths exist; on a fresh runner they don't.
        run: mkdir -p ~/printer_data/config/mmu
      - name: Symlink third-party Klipper extensions
        # printer.cfg uses [probe_eddy_ng] (provided by vvuk/eddy-ng) and
        # [mmu] / [mmu_machine] etc. (provided by moggieuk/Happy-Hare). On
        # the printer these are symlinked into ~/klipper/klippy/extras/ by
        # each project's install.sh. In CI vendor/klipper is vanilla, so
        # we replicate the symlink layer here. Source of truth for what
        # gets linked:
        #   eddy-ng: install.py FILES_TO_COPY (Python files only — the .c
        #     file is firmware-only and test_klippy.py doesn't compile MCUs)
        #   Happy-Hare: install.sh link_mmu_plugins (extras + extras/mmu)
        # Bumping vendor/eddy-ng or vendor/happy-hare may require updating
        # this list — check their install scripts for the file set.
        shell: bash
        run: |
          set -euo pipefail
          KLIPPER_EXTRAS=vendor/klipper/klippy/extras
          # eddy-ng — two Python files
          ln -sf "$PWD/vendor/eddy-ng/probe_eddy_ng.py" "$KLIPPER_EXTRAS/probe_eddy_ng.py"
          ln -sf "$PWD/vendor/eddy-ng/ldc1612_ng.py"   "$KLIPPER_EXTRAS/ldc1612_ng.py"
          # Happy-Hare — extras/*.py + extras/mmu/*.py
          mkdir -p "$KLIPPER_EXTRAS/mmu"
          for f in vendor/happy-hare/extras/*.py; do
            ln -sf "$PWD/$f" "$KLIPPER_EXTRAS/$(basename "$f")"
          done
          for f in vendor/happy-hare/extras/mmu/*.py; do
            ln -sf "$PWD/$f" "$KLIPPER_EXTRAS/mmu/$(basename "$f")"
          done
          echo "Symlinked extras:"
          ls -la "$KLIPPER_EXTRAS/probe_eddy_ng.py" "$KLIPPER_EXTRAS/ldc1612_ng.py" "$KLIPPER_EXTRAS/mmu_machine.py" "$KLIPPER_EXTRAS/mmu/mmu.py"
      - name: Run test_klippy.py against tests/voron-2-611.test
        # `shell: bash` enables `-eo pipefail` by default. Without it,
        # GitHub Actions runs `bash -e {0}` (no pipefail), so `tee`'s
        # exit code (0) would mask a non-zero from test_klippy.py and
        # the job would falsely report green. Codex P1.
        shell: bash
        working-directory: vendor/klipper
        run: |
          python scripts/test_klippy.py -v -d ../../tests/dict ../../tests/voron-2-611.test 2>&1 | tee klippy-test.log
      - name: Upload klippy log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: klippy-test-log
          path: |
            vendor/klipper/klippy-test.log
            vendor/klipper/_test_.log
            vendor/klipper/_test_output*
          if-no-files-found: ignore

  lint-and-refcheck:
    name: pre-commit + macro refcheck + pytest
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install tooling deps
        run: pip install -r requirements.txt
      - name: pre-commit (text hygiene + ruff)
        run: pre-commit run --all-files
      - name: Unit tests (pytest)
        run: python -m pytest tests/ -v
      - name: macro_refcheck against all .cfg files
        # failglob: bash exits nonzero if any glob matches nothing — catches
        # accidental directory renames / restructures that would otherwise
        # silently shrink coverage. `shell: bash` for `-eo pipefail` consistency.
        shell: bash
        run: |
          shopt -s failglob
          python scripts/macro_refcheck.py \
            printer.cfg eddy.cfg btt-ebb-sb-usb-v1.0.cfg mainsail.cfg timelapse.cfg \
            macros/*.cfg mmu/base/*.cfg mmu/addons/*.cfg mmu/optional/*.cfg
