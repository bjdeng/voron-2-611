# pre-commit hooks for voron-2-611
# Local: `pre-commit run --all-files` (or auto on commit if installed via `pre-commit install`)
# CI: same hooks run in .github/workflows/ci.yml

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^vendor/|^tests/dict/|^firmware/
      - id: end-of-file-fixer
        exclude: ^vendor/|^tests/dict/|^firmware/|^tests/builtins\.txt$
      - id: mixed-line-ending
        args: ['--fix=lf']
        exclude: ^vendor/|^tests/dict/|^firmware/
      - id: check-yaml
        files: \.(yaml|yml)$
        exclude: ^vendor/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
