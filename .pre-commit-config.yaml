# pre-commit hooks for voron-2-611
# Local: `pre-commit run --all-files` (or auto on commit if installed via `pre-commit install`)
# CI: same hooks run in .github/workflows/ci.yml
#
# Exclude pattern: vendor, tests/dict, tests/snapshots, firmware are sources we
# don't own. config/mainsail.cfg, config/timelapse.cfg, everything under
# config/mmu/base/, and the two optional Happy-Hare files are dereferenced
# from third-party symlinks on the Pi (mainsail-config, moonraker-timelapse,
# Happy-Hare) — see CLAUDE.md "Four classes of file on the Pi". The deploy
# script excludes them from push, so whitespace normalization here would
# create perpetual sync churn without any benefit.
#
# Note: config/mmu/base/mmu_parameters.cfg is NOT a symlink (per CLAUDE.md
# Known quirks) but is excluded along with the rest of mmu/base/ for pattern
# simplicity. Whitespace in it doesn't affect Klipper parsing.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: |
          (?x)^(
            vendor/|
            tests/dict/|
            tests/snapshots/|
            firmware/|
            config/(mainsail|timelapse)\.cfg|
            config/mmu/base/|
            config/mmu/optional/(client_macros|mmu_menu)\.cfg
          )
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
            vendor/|
            tests/dict/|
            tests/snapshots/|
            firmware/|
            tests/builtins\.txt|
            config/(mainsail|timelapse)\.cfg|
            config/mmu/base/|
            config/mmu/optional/(client_macros|mmu_menu)\.cfg
          )
      - id: mixed-line-ending
        args: ['--fix=lf']
        exclude: |
          (?x)^(
            vendor/|
            tests/dict/|
            tests/snapshots/|
            firmware/|
            config/(mainsail|timelapse)\.cfg|
            config/mmu/base/|
            config/mmu/optional/(client_macros|mmu_menu)\.cfg
          )
      - id: check-yaml
        files: \.(yaml|yml)$
        exclude: ^vendor/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
