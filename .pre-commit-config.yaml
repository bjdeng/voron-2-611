# pre-commit hooks for voron-2-611
# Local: `pre-commit run --all-files` (or auto on commit if installed via `pre-commit install`)
# CI: same hooks run in .github/workflows/ci.yml
#
# Exclude pattern: vendor, tests/dict, tests/snapshots, firmware are sources we
# don't own. config/mainsail.cfg, config/timelapse.cfg, config/chopper_tune.cfg
# are dereferenced from third-party symlinks on the Pi (mainsail-config,
# moonraker-timelapse, chopper-resonance-tuner) — see CLAUDE.md "Four classes
# of file on the Pi". Normalizing them here would create perpetual sync churn.
#
# All of config/mmu/ is Happy Hare v4's: macros/ + optional/ are symlinks into
# ~/Happy-Hare, base/*.cfg + .mmu_config are written by its installer, and
# mmu_vars.cfg is Klipper's live [save_variables] file (Pi is canonical). Any
# normalization would make the repo differ from the Pi and trip the deploy
# drift check.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: |
          (?x)^(
            vendor/|
            tests/dict/|
            tests/snapshots/|
            firmware/|
            config/(mainsail|timelapse|chopper_tune)\.cfg|
            config/mmu/
          )
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
            vendor/|
            tests/dict/|
            tests/snapshots/|
            firmware/|
            tests/builtins\.txt|
            config/(mainsail|timelapse|chopper_tune)\.cfg|
            config/mmu/
          )
      - id: mixed-line-ending
        args: ['--fix=lf']
        exclude: |
          (?x)^(
            vendor/|
            tests/dict/|
            tests/snapshots/|
            firmware/|
            config/(mainsail|timelapse|chopper_tune)\.cfg|
            config/mmu/
          )
      - id: check-yaml
        files: \.(yaml|yml)$
        exclude: ^vendor/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
