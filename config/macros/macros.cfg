# many useful macros referenced elsewhere.
# most of these were taken from https://ellis3dp.com/Print-Tuning-Guide/articles/index_useful_macros.html
# some are directly from ellis' provile at https://github.com/AndrewEllis93/v2.247_backup_klipper_config/blob/master/macros.cfg

# ---- Home helpers ----

# Conditional G28 (home if not already homed)
[gcode_macro _CG28]
description: Internal helper: G28 only if not already homed.
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

# Conditional QGL (home if not already done)
[gcode_macro _CQGL]
description: Internal helper: QUAD_GANTRY_LEVEL only if not already applied.
gcode:
    {% if printer.quad_gantry_level.applied == False %}
        {% if "xyz" not in printer.toolhead.homed_axes %}
            G28 ; home if not already homed
        {% endif %}
        QUAD_GANTRY_LEVEL
        G28 Z
    {% endif %}

# ---- Shutdown ----

# Case light helpers. Default ON brightness is 0.3 (matches what
# PRINT_START used to inline); callers can override with VALUE=.

[gcode_macro CASELIGHT_ON]
description: Turn the case light on. Default brightness 0.3; override with VALUE=0.0..1.0.
gcode:
    {% set value = params.VALUE|default(0.3)|float %}
    SET_PIN PIN=caselight VALUE={value}

[gcode_macro CASELIGHT_OFF]
description: Turn the case light off.
gcode:
    SET_PIN PIN=caselight VALUE=0

[gcode_macro _OFF_EXCEPT_EXHAUST]
description: Internal helper: the OFF sequence MINUS the chamber exhaust, so the non-blocking cooldown can leave the exhaust running. Not the user-facing all-off — call OFF from the console; internal callers are OFF and _PRINT_END_CLEANUP.
gcode:
    M84                                  ; turn steppers off
    TURN_OFF_HEATERS                     ; turn bed / hotend / chamber heater (BedFans) off
    SET_GCODE_VARIABLE MACRO=_CHAMBER_CONTROL VARIABLE=active_target VALUE=0   ; clear recorded chamber target
    M107                                 ; turn print cooling fan off
    CASELIGHT_OFF                        ; turn case light off

[gcode_macro OFF]
description: Shut everything off (steppers, heaters, part fan, chamber exhaust, case light).
gcode:
    _OFF_EXCEPT_EXHAUST
    SET_FAN_SPEED FAN=chamber_exhaust SPEED=0                    ; exhaust fan off
    UPDATE_DELAYED_GCODE ID=_COOLDOWN_EXHAUST_OFF DURATION=0     ; cancel any pending cooldown stop (manual OFF mid-cooldown leaves no orphan timer)

[gcode_macro SHUTDOWN]
description: OFF + tell Moonraker to power off the host.
gcode:
    OFF
    {action_call_remote_method("shutdown_machine")}   ; Moonraker compatible

[delayed_gcode DELAYED_OFF]
gcode:
    OFF ; call "OFF" macro, to turn off everything (heaters, motors, lights, fans)

# ---- Park positions ----

# Park at center of build volume
[gcode_macro PARKCENTER]
description: Park toolhead at center of build volume.
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                           ; home if not already homed
    {% endif %}
    SAVE_GCODE_STATE NAME=PARKCENTER
    G90                               ; absolute positioning
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} Z{printer.toolhead.axis_maximum.z/2} F6000
    RESTORE_GCODE_STATE NAME=PARKCENTER

# Park 15mm above center of bed
[gcode_macro PARKBED]
description: Park toolhead 15mm above center of bed.
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                           ; home if not already homed
    {% endif %}
    SAVE_GCODE_STATE NAME=PARKBED
    G90                                ; absolute positioning
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} Z15 F6000
    RESTORE_GCODE_STATE NAME=PARKBED

# Park front center
[gcode_macro PARKFRONT]
description: Park toolhead at front center, mid-height.
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                           ; home if not already homed
    {% endif %}
    SAVE_GCODE_STATE NAME=PARKFRONT
    G90                               ; absolute positioning
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} Z{printer.toolhead.axis_maximum.z/2} F6000
    RESTORE_GCODE_STATE NAME=PARKFRONT

# Park front center, but low down.
[gcode_macro PARKFRONTLOW]
description: Park toolhead at front center, low Z.
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                           ; home if not already homed
    {% endif %}
    SAVE_GCODE_STATE NAME=PARKFRONT
    G90                              ; absolute positioning
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} Z20 F6000
    RESTORE_GCODE_STATE NAME=PARKFRONT

# Park top rear left
[gcode_macro PARKREAR]
description: Park toolhead at rear left, near top.
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                           ; home if not already homed
    {% endif %}
    SAVE_GCODE_STATE NAME=PARKREAR
    G90                              ; absolute positioning
    G0 X{printer.toolhead.axis_minimum.x+10} Y{printer.toolhead.axis_maximum.y-10} Z{printer.toolhead.axis_maximum.z-50} F6000
    RESTORE_GCODE_STATE NAME=PARKREAR

# ---- Speed / heater overrides ----

[gcode_macro _RESETSPEEDS]
description: Internal helper: revert velocity/accel/SCV to configured maxima.
gcode:
    SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity}
    SET_VELOCITY_LIMIT ACCEL={printer.configfile.settings.printer.max_accel}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={printer.configfile.settings.printer.square_corner_velocity}

[gcode_macro M109]
description: Wait for hotend within ±tolerance of target (renames stock to M99109).
rename_existing: M99109
gcode:
    #Parameters
    {% set s = params.S|float %}

    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  ; Set hotend temp
    {% if s != 0 %}
        {% set tol = printer["gcode_macro _USER_VARIABLE"].m109_tolerance_celsius|int %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} MAXIMUM={s + tol}   ; Wait for hotend temp (within tolerance)
    {% endif %}

# ---- Multi-step ----

[gcode_macro HEATSOAK]
description: Heat bed (+ optional chamber wait) and park center for soak.
gcode:
    # Parameters
    {% set t = params.T|default(printer["gcode_macro _USER_VARIABLE"].heatsoak_default_bed_target)|int %}
    {% set c = params.C|default(printer["gcode_macro _USER_VARIABLE"].heatsoak_default_chamber_target)|int %}
    {% set move = params.MOVE|default(1)|int %}
    {% set wait = params.WAIT|default(0)|int %}

    SAVE_GCODE_STATE NAME=HEATSOAK
    UPDATE_DELAYED_GCODE ID=DELAYED_OFF DURATION=0    ; cancel off timer (if there is one)
    M140 S{t}                                         ; heat bed
    {% if move == 1 %}
        _CG28
        G90
        G0 Z{printer.toolhead.axis_maximum.z/2} F19500
        G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} F19500
    {% endif %}
    {% if c > 30 and wait == 1 %}
        # Engage the chamber heater actively. Pre-refactor (bang-bang BedFans),
        # HEATSOAK relied on bed radiation alone to bring the chamber up — the
        # TEMPERATURE_WAIT below would block until passive heating got there.
        # Post-refactor, [heater_generic chamber] is the real heat source;
        # set its target so PID drives BedFans and the chamber actually reaches c.
        SET_CHAMBER_TARGET TARGET={c}
        TEMPERATURE_WAIT SENSOR="heater_generic chamber" MINIMUM={c} ; wait for chamber temp
    {% endif %}
    RESTORE_GCODE_STATE NAME=HEATSOAK
