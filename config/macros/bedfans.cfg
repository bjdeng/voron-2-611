########################################
# BedFans deprecation note (2026-05-22):
#
# This file used to define [fan_generic BedFans] and the BEDFANSSLOW /
# BEDFANSFAST / BEDFANSOFF manual aliases. Both are gone — the BedFans
# PWM pin (z:P2.5) is now owned by [heater_generic chamber] in bed.cfg,
# which runs PID against the chamber thermistor.
#
# This file is preserved for the SET_HEATER_TEMPERATURE override below
# (routes heater_bed via M99140 — unrelated to BedFans). Will eventually
# be renamed once we move that override elsewhere.
########################################

############ Command overrides ############
[gcode_macro SET_HEATER_TEMPERATURE]
description: Override of stock SET_HEATER_TEMPERATURE — routes heater_bed via M99140 so the M140 alias and Mainsail's set-bed-temp button both route the same way. Other heaters (extruder, chamber heater_generic, etc.) pass through to stock.
rename_existing: _SET_HEATER_TEMPERATURE
gcode:
	# Parameters
	{% set HEATER = params.HEATER|default("None") %}
	{% set TARGET = params.TARGET|default(0)|int %}

	{% if HEATER|lower == "extruder" %}
		M104 S{TARGET}
	{% elif HEATER|lower == "heater_bed" %}
		M99140 S{TARGET}
	{% elif HEATER|lower == "chamber" %}
		# Mainsail UI / Moonraker / KlipperScreen / OctoPrint emit raw
		# SET_HEATER_TEMPERATURE HEATER=chamber when the operator clicks the
		# chamber heater control. Route that through SET_CHAMBER_TARGET so the
		# request gets clamped to [0, chamber_max_target] like every other
		# chamber setpoint.
		SET_CHAMBER_TARGET TARGET={TARGET}
	{% else %}
		_SET_HEATER_TEMPERATURE HEATER={HEATER} TARGET={TARGET}
	{% endif %}

# Override M190 (Wait for Bed Temperature)
# Use TEMPERATURE_WAIT with a tolerance band so we don't wait for PID to level off.
[gcode_macro M190]
description: Override of stock M190 — uses TEMPERATURE_WAIT with a tolerance band to avoid waiting for PID overshoot to settle.
rename_existing: M99190
gcode:
	# Parameters
	{% set S = params.S|int %}
	# Vars
	{% set TOL = printer["gcode_macro _USER_VARIABLE"].m190_tolerance_celsius|int %}

	M140 {% for p in params
	  %}{'%s%s' % (p, params[p])}{%
	  endfor %}																	# Set bed temp

	{% if S != 0 %}
		TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={S|int} MAXIMUM={S|int + TOL}	# Wait for bed temp within tolerance
	{% endif %}

# Replace M140 (Set Bed Temperature) to just be an alias of SET_HEATER_TEMPERATURE so
# M140 / Mainsail set-bed-temp / SET_HEATER_TEMPERATURE all route the same way.
[gcode_macro M140]
description: Alias to SET_HEATER_TEMPERATURE so M140, Mainsail, and direct SET_HEATER_TEMPERATURE all route the bed target through one path.
rename_existing: M99140
gcode:
	# Parameters
	{% set S = params.S|float %}

	SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={S}
