#####################################################################
#   Print lifecycle — PRINT_START / PRINT_END + shared cleanup tail.
#
#   Spec: docs/superpowers/specs/2026-05-18-print-lifecycle-redesign.md
#   Slicer hookup: docs/slicer-templates/orcaslicer.md
#   Originally derived from jontek2's "A better print_start macro" with
#   heat-overlap optimization (bed/hotend warm in background while
#   gantry homes + QGLs).
#
#   How the slicer wraps PRINT_START:
#   OrcaSlicer's machine-start gcode calls PRINT_START as the MIDDLE of
#   a 5-step sequence:
#     1. M104 S0 / M140 S0            # suppress slicer's own heat waits
#     2. MMU_START_SETUP              # HH pre-print MMU init (tools/colors)
#     3. MMU_START_CHECK              # HH gate availability check
#     4. PRINT_START [params]         # THIS FILE
#     5. MMU_START_LOAD_INITIAL_TOOL  # filament loads AFTER PRINT_START returns
#
#   Filament loading is NOT in PRINT_START's scope — it happens after we
#   return, on the slicer's line 5. The M107 in step 12 is just "part
#   cooling fan off" (slicer convention), unrelated to MMU.
#####################################################################

[gcode_macro PRINT_START]
description: Full print start. Validates slicer params, overlaps mechanical setup with bed/hotend warmup, taps Z with hot bed + warm nozzle, calibrates mesh, hot-wipes the nozzle.
gcode:
  # 1. Tap-threshold pre-flight. PROBE METHOD=tap fails with "Tap not
  #    configured" if tap_threshold isn't > 0 (see _prep_trigger_analog_tap
  #    in vendor/klipper/klippy/extras/probe_eddy_current.py). Surface the
  #    actionable fix instead of letting Klipper's terse error fire
  #    mid-PRINT_START.
  {% set probe_cfg = printer.configfile.settings['probe_eddy_current btt_eddy'] %}
  {% if probe_cfg.tap_threshold|default(0)|float <= 0 %}
    { action_raise_error("PRINT_START aborted: tap_threshold not calibrated. Run PROBE_EDDY_CURRENT_TAP_CALIBRATE TAP=guess, then TAP=refine, then TAP=verify, with SAVE_CONFIG after each.") }
  {% endif %}

  # 2. Slicer-provided params.
  {% set bed         = params.BED|int %}
  {% set extruder    = params.EXTRUDER|int %}
  {% set chamber     = params.CHAMBER|default(0)|int %}
  {% set material    = params.MATERIAL|default("?")|string %}
  {% set total_layer = params.TOTAL_LAYER|default(0)|int %}
  {% set z_adjust    = params.Z_ADJUST|default(0)|float %}

  # 3. Max-temp guard. A misconfigured slicer profile shouldn't risk
  #    hardware. Klipper would eventually reject, but late + cryptic.
  {% set bed_max = printer.configfile.settings.heater_bed.max_temp|int %}
  {% set ext_max = printer.configfile.settings.extruder.max_temp|int %}
  {% if bed > bed_max or extruder > ext_max %}
    { action_raise_error("PRINT_START aborted: BED=%d or EXTRUDER=%d exceeds configured max (heater_bed.max_temp=%d / extruder.max_temp=%d)." % (bed, extruder, bed_max, ext_max)) }
  {% endif %}

  # 4. State reset (clears stale state from any prior cancelled print).
  CLEAR_PAUSE
  _RESETSPEEDS
  BED_MESH_CLEAR
  CASELIGHT_ON
  # Reset cleanup re-entry guard. If a prior _PRINT_END_CLEANUP errored mid-G4
  # the guard would be stuck at 1; clearing it here ensures the next PRINT_END
  # runs cleanup normally. Cheaper than chasing every error-path manually.
  SET_GCODE_VARIABLE MACRO=_PRINT_END_CLEANUP VARIABLE=in_cleanup VALUE=0
  # NB: no chamber action here — step 6 sets the chamber target once the
  # slicer params are known.

  # 5. UI hints. SET_PRINT_STATS_INFO TOTAL_LAYER drives Mainsail's
  #    progress bar accuracy. M117 is a quick LCD/Mainsail status line.
  {% if total_layer > 0 %}
    SET_PRINT_STATS_INFO TOTAL_LAYER={total_layer}
  {% endif %}
  M117 Print: {material} bed={bed} hotend={extruder} chamber={chamber}

  # 6. Start heaters NON-BLOCKING — bed warms while gantry homes + QGLs.
  #    SET_HEATER_TEMPERATURE is the canonical entry point; bedfans.cfg
  #    overrides it to route heater_bed via M99140 (so M140 / Mainsail /
  #    SET_HEATER_TEMPERATURE all set the bed the same way).
  #
  #    Hotend partial target: 70% of the slicer's full extruder temp.
  #    Saves ~15-25s vs the prior fixed 150°C, because step 12's M109 ramps
  #    from a closer starting point. Stays safely below typical vitrification:
  #    PLA at 210 → partial 147 (below 60°C bed but well below softening),
  #    ABS at 250 → partial 175, ASA at 240 → 168. Step 11 then bumps
  #    non-blocking to the full target while mesh runs, so by step 12 the
  #    hotend is at or very near {extruder}.
  #
  #    Chamber target: HALF the slicer's chamber target — preheat to a safe
  #    intermediate without committing the full heating budget. The ramp to
  #    {chamber} happens in step 12 (after final tap-Z) so a print that
  #    aborts/cancels/stalls in PRINT_START doesn't burn energy heating the
  #    chamber to a temperature it'll never use. For CHAMBER=0 (PLA), this
  #    is TARGET=0 — the chamber heater stays off (no chamber heating, no
  #    VOC circulation, which is correct for low-temp materials).
  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bed}
  M104 S{(extruder * 0.7)|int}                           # hotend partial = 70% of full (non-blocking)
  SET_CHAMBER_TARGET TARGET={(chamber / 2)|int}          # chamber half-target until step 12 commits to full

  # 7. Mechanical ops while heaters ramp. Cold-bed QGL is the working
  #    pattern on this build — see memory/qgl-two-pass-intentional.md
  #    for the 2-pass rationale (mechanical saggy-rear quirk, not
  #    thermal). Bed mesh (step 12) handles bed-surface shape change
  #    at temp; QGL just trams the gantry parallel to the bed.
  _CG28
  G90
  _CQGL

  # 8. Now wait for the heat we started in step 6.
  #    MINIMUM-only (no MAXIMUM): returns the moment temp crosses MIN. If bed
  #    PID overshoots above the band the prior MAXIMUM={bed + bed_tol} would
  #    wait pointlessly for it to cool back down — saves 0-30s when overshoot
  #    occurs. Extruder MIN matches the step-6 partial target so we wait for
  #    the heat we actually asked for (not a fixed 150).
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed}
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={(extruder * 0.7)|int}

  # 9. Chamber soak branch (slicer-driven, per-material).
  #    Hot materials (ABS/ASA/PA-CF): slicer passes the desired in-print
  #    chamber temp (e.g. CHAMBER=55 for ABS). The [heater_generic chamber]
  #    PID holds that setpoint for the entire print. PRINT_START's
  #    TEMPERATURE_WAIT only waits for HALF the setpoint though — cold-start
  #    chamber can reach ~chamber/2 from bed radiation alone in a few minutes,
  #    but the full target may take 30+ min to hit (the only heat source is
  #    the bed; BedFans just circulate it). The PID keeps driving BedFans
  #    after the print starts; the chamber climbs the rest of the way from
  #    accumulating part radiation while we lay down the early layers.
  #    Cold materials (PLA/PETG/TPU): slicer passes CHAMBER=0 — we run
  #    a brief bed-mass equilibration soak instead.
  {% set soak_s = printer["gcode_macro _USER_VARIABLE"].bed_stabilization_soak_seconds|int %}
  {% if chamber > 0 %}
    # Chamber target was set in step 6 to chamber/2 — heater_generic has been
    # driving toward that for the duration of steps 6-8. The MINIMUM here
    # matches the step-6 target exactly so we wait for it to actually arrive.
    # No PARKCENTER here — the chamber temp sensor lives on the chamber
    # wall, not the toolhead, so toolhead position doesn't affect the
    # sensor reading. Toolhead stays at QGL's last probe position (a
    # corner) during soak. The "park during soak" pattern was load-
    # bearing only when the sensor was on the toolhead and needed a
    # representative-air spot.
    TEMPERATURE_WAIT SENSOR="heater_generic chamber" MINIMUM={(chamber / 2)|int}   # wait for the half-target we set in step 6
  {% elif soak_s > 0 %}
    G4 P{(soak_s * 1000)|int}
  {% else %}
    # chamber=0 AND soak_s=0: no soak at all. Reachable only if
    # bed_stabilization_soak_seconds is explicitly zeroed in _USER_VARIABLE.
    # Intentional silent-skip — slicer's PLA path normally has soak_s>0.
  {% endif %}

  # 10. Per-filament Z baby-step (optional). Eddy native tap makes this
  #     mostly unnecessary; useful for plate-type compensation (smooth
  #     vs textured) or filament-specific first-layer behavior. The
  #     offset persists across step 12's final G28 Z (SET_GCODE_OFFSET
  #     is kinematic-frame, not bed-frame), so it applies correctly
  #     against the print-authoritative Z reference.
  {% if z_adjust != 0.0 %}
    SET_GCODE_OFFSET Z_ADJUST={z_adjust} MOVE=1
  {% endif %}

  # 11. Adaptive bed mesh over the actual print area. Probed against the
  #     Z reference from step 7's QGL-driven _CG28 home — fine because
  #     mesh values are RELATIVE shape (anchored to zero_reference_position
  #     175,175 per eddy.cfg). When step 12's final tap-Z rebases the
  #     kinematic Z=0, the mesh's anchor follows; the relative shape
  #     compensation stays correct against the new reference. See
  #     [the "Removed pre-mesh tap-Z" amendment in the print-lifecycle
  #     spec for the analysis.](docs/superpowers/specs/2026-05-18-print-lifecycle-redesign.md)
  #
  #     M104 to full hotend target fires non-blocking BEFORE mesh runs.
  #     Mesh takes ~30-60s during which the hotend ramps from the step-6
  #     partial (70%) to the full target. By the time mesh finishes and
  #     step 12's M109 runs, the hotend is at or very close to target,
  #     making M109 return near-instantly. Saves ~30s vs the prior path
  #     where M109 had to wait through the entire partial→full ramp.
  #     No filament drip risk: filament hasn't been loaded yet — that
  #     happens in MMU_START_LOAD_INITIAL_TOOL after PRINT_START returns.
  M104 S{extruder}
  BED_MESH_CALIBRATE ADAPTIVE=1

  # 12. Final hotend heat + hot nozzle wipe + final tap-Z (print-Z
  #     reference) with hot + clean nozzle. The mesh from step 11 follows
  #     this new Z reference automatically — its shape stays correct
  #     against whatever the current kinematic Z=0 is. M109 (our override)
  #     waits within m109_tolerance_celsius of target.
  #
  #     The G28 Z here is the ONLY pre-print tap that matters for absolute
  #     print accuracy — the earlier _CG28 in step 7 just establishes a
  #     Z home so QGL + mesh can run. Cost: ~10-15s per print. The
  #     homing_override in eddy.cfg handles safe-Z behavior and invokes
  #     SET_Z_FROM_PROBE (multi-sample retry-until-consensus via gcmd args).
  M109 S{extruder}
  M107                                                   # part cooling fan off
  BLOBIFIER_CLEAN                                        # hot wipe = effective wipe
  G28 Z

  # 13. Commit chamber to full target now that PRINT_START has reached the
  #     last expensive step. If any earlier step aborted (tap failure, mesh
  #     error, cancel), chamber stayed at the step-6 half-target and we
  #     skipped the full-temperature heating budget. Only paying for the full
  #     {chamber} heat when we're definitely about to print. For PLA
  #     (chamber=0), skip — the chamber heater stays off all print.
  {% if chamber > 0 %}
    SET_CHAMBER_TARGET TARGET={chamber}
  {% endif %}


[gcode_macro PRINT_END]
description: Normal end-of-print cleanup. Retracts, lifts, parks at rear-left, then defers to _PRINT_END_CLEANUP for cooldown + OFF. CANCEL_PRINT mid-print runs _PRINT_END_CLEANUP only (upstream client.cfg handles its own retract+park+heaters-off first).
gcode:
  # Capture the print's chamber target NOW, at macro entry. The whole template
  # renders once before any gcode runs, so this binds to active_target BEFORE
  # the SET_CHAMBER_TARGET TARGET=0 below zeroes it — the {% if %} gate then
  # sees the real print target. (Render-once Jinja working in our favour; see
  # CLAUDE.md "Klipper gotchas".)
  {% set chamber_target = printer["gcode_macro _CHAMBER_CONTROL"].active_target|float %}
  M400                                                   # flush move buffer
  G92 E0                                                 # zero extruder
  G91                                                    # relative
  G1 E-2 F2700                                           # small retract — clean nozzle disengage
  G1 Z10 F3000                                           # lift 10mm
  G90                                                    # absolute
  G1 X{printer.toolhead.axis_minimum.x + 10} Y{printer.toolhead.axis_maximum.y - 15} F6000   # park rear-left, inset (10, 340) on this build
  G1 Z1 F600                                             # descend to Z=1 so bed catches the gantry on motors-off sag — limits sag depth to (1mm + whatever the nozzle compresses PEI). Park spot at (10, 340) is in skirt area, so PEI wear here doesn't affect print area.
  M104 S0                                                # hotend heater off
  M140 S0                                                # bed heater off
  SET_CHAMBER_TARGET TARGET=0                            # chamber heater (BedFans) off — no more hold-target; VEFACH owns cooldown now
  M107                                                   # part fan off
  # Cooldown / VOC evacuation (VEFACH). bed + hotend + chamber heater off above.
  # For chamber (VOC) prints, run the VEFACH carbon exhaust (chamber_exhaust,
  # z:P2.7) for the cooldown window: active cooling + VOC evacuation to room,
  # decoupled from the BedFans. chamber_target was captured at macro entry.
  # _PRINT_END_CLEANUP's G4 is the runtime; its OFF stops the fan. PLA/PETG
  # (target 0) skip it — chamber-target>0 is the VOC proxy.
  # Spec: docs/superpowers/specs/2026-06-03-vefach-exhaust-cooldown-decouple.md
  {% if chamber_target > 0 %}
    SET_FAN_SPEED FAN=chamber_exhaust SPEED={printer["gcode_macro _USER_VARIABLE"].chamber_exhaust_cooldown_speed}
  {% endif %}
  _PRINT_END_CLEANUP


[gcode_macro _PRINT_END_CLEANUP]
description: Shared cleanup tail — bed mesh clear, cooldown delay, OFF, reset speeds. Called by PRINT_END (after its retract/park/heaters-off) and by upstream CANCEL_PRINT via _CLIENT_VARIABLE.user_cancel_macro. Guarded against re-entry so a cancel-during-cooldown-G4 doesn't trigger a second 5-minute G4.
variable_in_cleanup: 0
gcode:
  {% set in_cleanup = printer["gcode_macro _PRINT_END_CLEANUP"].in_cleanup %}
  {% if in_cleanup %}
    # Re-entered while a prior cleanup is still in its G4. Skip — the
    # outer cleanup will complete the OFF + _RESETSPEEDS path. Without
    # this guard, cancel-during-G4 → _CANCEL_PRINT_HOOK → _PRINT_END_CLEANUP
    # would queue a second 5-minute G4 behind the first.
    RESPOND TYPE=echo MSG="_PRINT_END_CLEANUP already running; skipping re-entry"
  {% else %}
    SET_GCODE_VARIABLE MACRO=_PRINT_END_CLEANUP VARIABLE=in_cleanup VALUE=1
    BED_MESH_CLEAR
    {% set cooldown_ms = printer["gcode_macro _USER_VARIABLE"].print_end_cooldown_seconds|int * 1000 %}
    G4 P{cooldown_ms}
    OFF
    _RESETSPEEDS
    SET_GCODE_VARIABLE MACRO=_PRINT_END_CLEANUP VARIABLE=in_cleanup VALUE=0
  {% endif %}

[delayed_gcode _COOLDOWN_EXHAUST_OFF]
# Non-blocking cooldown: stops the VEFACH chamber exhaust after the cooldown
# window. Armed by _PRINT_END_CLEANUP via UPDATE_DELAYED_GCODE; cancelled by
# OFF and by PRINT_START. No initial_duration — must never fire at boot.
gcode:
  SET_FAN_SPEED FAN=chamber_exhaust SPEED=0
