#####################################################################
#   A better print_start macro for v2/trident
#   https://github.com/jontek2/A-better-print_start-macro
#####################################################################
[gcode_macro PRINT_WARMUP]
gcode:
  {% set bed = params.BED|int %}
  {% set extruder = params.EXTRUDER|int %}
  {% set chamber = params.CHAMBER|default("0")|int %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

  SET_PIN PIN=caselight VALUE=0.3
  _RESETSPEEDS
  BED_MESH_CLEAR                                        # Clear old saved bed mesh (if any)
  _CG28
  _CQGL
  M140 S{bed}                                           # set the bed to the target temp
  M104 S{extruder}
  # M104 S150                                             # Heat hotend to 150c


[gcode_macro PRINT_START]
gcode:
  # # This part fetches data from your slicer. Such as bed, extruder, and chamber temps and size of your printer.
  {% set bed = params.BED|int %}
  {% set extruder = params.EXTRUDER|int %}
  {% set chamber = params.CHAMBER|default("0")|int %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

  # SET_PIN PIN=caselight VALUE=0.3
  # _RESETSPEEDS
  # BED_MESH_CLEAR                                        # Clear old saved bed mesh (if any)
  # M140 S{bed}                                           # set the bed to the target temp
  # M104 S150                                             # Heat hotend to 150c

  # Home the printer, set absolute positioning and update the Stealthburner LEDs.
  _CG28                                                 # Full home (XYZ)
  _CQGL # QUAD_GANTRY_LEVEL                             # Level the printer via QGL
  G90                                                   # Absolute position

  # {% if printer['temperature_fan chamber'].temperature < (chamber/2) or printer.heater_bed.temperature < (bed-2)  %}
  #     HEATSOAK T={bed} C={chamber} MOVE=1 WAIT=1        # heatsoak macro + park in center
  # {% else %}                                            # - if chamber is already at temp:
  #     HEATSOAK T={bed} C={chamber} MOVE=0 WAIT=0        # "heatsoak" without parking (only still calling this because it does some other things like turn off exahaust fan)
  # {% endif %}

  # Check if the bed temp is higher than 90c - if so then trigger a heatsoak.
  {% if params.BED|int > 90 %}
    # SET_DISPLAY_TEXT MSG="Bed: {bed}c"                  # Display info on display
    M106 S255                                           # Turn on the PT-fan

    PARKCENTER                                         # Go to center of the bed
    M190 S{bed}                                  # Set the target temp for the bed
    TEMPERATURE_WAIT SENSOR="temperature_fan chamber" MINIMUM={(chamber/2)}   # Waits for chamber temp

  # If the bed temp is not over 90c, then skip the heatsoak and just heat up to set temp with a 5 min soak
  {% else %}
    # PARKCENTER                                         # Go to center of the bed
    M190 S{bed}                                  # Set the target temp for the bed
    # G4 P60000                                          # Wait 5 min for the bedtemp to stabilize
  {% endif %}

  BLOBIFIER_CLEAN
  G28 Z                                                # Home Z again after QGL (uses safe_z_home + probe descent)
  PROBE METHOD=tap                                     # Tap for high-precision Z reference at print temp
  SET_KINEMATIC_POSITION Z={printer.probe.last_z_result}  # Apply tap result as Z reference
  BED_MESH_CALIBRATE ADAPTIVE=1                        # Start the bed mesh (add ADAPTIVE=1) for adaptive bed mesh

  # Heat up the hotend up to target via data from slicer
  G1 X{x_wait} Y{y_wait} Z15 F9000                      # Go to center of the bed
  M107                                                  # Turn off partcooling fan
  M109 S{extruder}                                      # Heat the hotend to set temp

  # # Get ready to print by doing a prime line
  # G0 X{x_wait - 50} Y2 F10000                           # Go to starting point
  # G0 Z0.3                                               # Raise Z to 0.4
  # G91                                                   # Incremental positioning
  # G1 X100 E15 F1000                                     # Primeline
  # G90                                                   # Absolute position

[gcode_macro PRINT_END]
gcode:
    #RESETRGB                                                                            ; revert LCD RGB
    M400                                                                                 ; wait for buffer to clear
    G92 E0                                                                               ; zero the extruder
    M104 S0                                                                              ; turn only the hotend off
    M140 S0                                                                              ; return the bed to temp, slicers like to turn it off
    M107                                                                                 ; turn off part cooling fan
    G91                                                                                  ; relative positioning
    G1 Z5 F3000                                                                          ; move nozzle up 5mm
    G90                                                                                  ; absolute positioning
    BED_MESH_CLEAR
    # G1 X{printer.toolhead.axis_maximum.x} Y{printer.toolhead.axis_maximum.y} F19500.0    ; park nozzle at rear
    G4 P60000 ;wait 5 min to let things circulate and cool down
    OFF
    _RESETSPEEDS                                                                         ; reset speed, accel etc to configured max values
