#####################################################################
#   Print lifecycle — PRINT_START / PRINT_END + shared cleanup tail.
#
#   Spec: docs/superpowers/specs/2026-05-18-print-lifecycle-redesign.md
#   Slicer hookup: docs/slicer-templates/orcaslicer.md
#   Originally derived from jontek2's "A better print_start macro" with
#   heat-overlap optimization (bed/hotend warm in background while
#   gantry homes + QGLs).
#
#   How the slicer wraps PRINT_START:
#   OrcaSlicer's machine-start gcode calls PRINT_START as the MIDDLE of
#   a 5-step sequence:
#     1. M104 S0 / M140 S0            # suppress slicer's own heat waits
#     2. MMU_START_SETUP              # HH pre-print MMU init (tools/colors)
#     3. MMU_START_CHECK              # HH gate availability check
#     4. PRINT_START [params]         # THIS FILE
#     5. MMU_START_LOAD_INITIAL_TOOL  # filament loads AFTER PRINT_START returns
#
#   Filament loading is NOT in PRINT_START's scope — it happens after we
#   return, on the slicer's line 5. The M107 in step 11 is just "part
#   cooling fan off" (slicer convention), unrelated to MMU.
#####################################################################

[gcode_macro PRINT_START]
description: Full print start. Validates slicer params, overlaps mechanical setup with bed/hotend warmup, taps Z with hot bed + warm nozzle, calibrates mesh, hot-wipes the nozzle.
gcode:
  # 1. Tap-threshold pre-flight. PROBE METHOD=tap fails with "Tap not
  #    configured" if tap_threshold isn't > 0 (see _prep_trigger_analog_tap
  #    in vendor/klipper/klippy/extras/probe_eddy_current.py). Surface the
  #    actionable fix instead of letting Klipper's terse error fire
  #    mid-PRINT_START.
  {% set probe_cfg = printer.configfile.settings['probe_eddy_current btt_eddy'] %}
  {% if probe_cfg.tap_threshold|default(0)|float <= 0 %}
    { action_raise_error("PRINT_START aborted: tap_threshold not calibrated. Run PROBE_EDDY_CURRENT_TAP_CALIBRATE TAP=guess, then TAP=refine, then TAP=verify, with SAVE_CONFIG after each.") }
  {% endif %}

  # 2. Slicer-provided params.
  {% set bed         = params.BED|int %}
  {% set extruder    = params.EXTRUDER|int %}
  {% set chamber     = params.CHAMBER|default(0)|int %}
  {% set material    = params.MATERIAL|default("?")|string %}
  {% set total_layer = params.TOTAL_LAYER|default(0)|int %}
  {% set z_adjust    = params.Z_ADJUST|default(0)|float %}

  # 3. Max-temp guard. A misconfigured slicer profile shouldn't risk
  #    hardware. Klipper would eventually reject, but late + cryptic.
  {% set bed_max = printer.configfile.settings.heater_bed.max_temp|int %}
  {% set ext_max = printer.configfile.settings.extruder.max_temp|int %}
  {% if bed > bed_max or extruder > ext_max %}
    { action_raise_error("PRINT_START aborted: BED=%d or EXTRUDER=%d exceeds configured max (heater_bed.max_temp=%d / extruder.max_temp=%d)." % (bed, extruder, bed_max, ext_max)) }
  {% endif %}

  # 4. State reset (clears stale state from any prior cancelled print).
  CLEAR_PAUSE
  _RESETSPEEDS
  BED_MESH_CLEAR
  CASELIGHT_ON
  UPDATE_DELAYED_GCODE ID=chamber_control_loop DURATION=1    # bootstrap chamber control (VOC baseline until SET_CHAMBER_TARGET runs)

  # 5. UI hints. SET_PRINT_STATS_INFO TOTAL_LAYER drives Mainsail's
  #    progress bar accuracy. M117 is a quick LCD/Mainsail status line.
  {% if total_layer > 0 %}
    SET_PRINT_STATS_INFO TOTAL_LAYER={total_layer}
  {% endif %}
  M117 Print: {material} bed={bed} hotend={extruder} chamber={chamber}

  # 6. Start heaters NON-BLOCKING — bed warms while gantry homes + QGLs.
  #    SET_HEATER_TEMPERATURE is the canonical entry point; bedfans.cfg
  #    overrides it to route heater_bed via M99140 (so M140 / Mainsail /
  #    SET_HEATER_TEMPERATURE all set the bed the same way). BedFans is
  #    no longer touched here — chamber_control_loop owns BedFans state.
  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bed}
  M104 S150                                              # hotend partial (non-blocking)

  # 7. Mechanical ops while heaters ramp. Cold-bed QGL is the working
  #    pattern on this build — see memory/qgl-two-pass-intentional.md
  #    for the 2-pass rationale (mechanical saggy-rear quirk, not
  #    thermal). Bed mesh (step 12) handles bed-surface shape change
  #    at temp; QGL just trams the gantry parallel to the bed.
  _CG28
  G90
  _CQGL

  # 8. Now wait for the heat we started in step 6.
  {% set bed_tol = printer["gcode_macro _USER_VARIABLE"].m190_tolerance_celsius|int %}
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed} MAXIMUM={bed + bed_tol}
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM=150 MAXIMUM=170

  # 9. Chamber soak branch (slicer-driven, per-material).
  #    Hot materials (ABS/ASA/PA-CF): slicer passes the desired in-print
  #    chamber temp (e.g. CHAMBER=55 for ABS). The control loop holds at
  #    that setpoint for the entire print. PRINT_START's TEMPERATURE_WAIT
  #    only waits for HALF the setpoint though — cold-start chamber can
  #    reach ~chamber/2 from bed radiation alone in a few minutes, but
  #    the full target may take 30+ min to hit without active heat from
  #    a chamber heater (this build has none). The loop keeps driving
  #    BedFans heat-mode after the print starts; chamber climbs the rest
  #    of the way from accumulating part radiation while we lay down
  #    the early layers.
  #    Cold materials (PLA/PETG/TPU): slicer passes CHAMBER=0 — we run
  #    a brief bed-mass equilibration soak instead.
  {% set soak_s = printer["gcode_macro _USER_VARIABLE"].bed_stabilization_soak_seconds|int %}
  {% if chamber > 0 %}
    SET_CHAMBER_TARGET TARGET={chamber}                  # loop holds chamber at full setpoint for the whole print
    # No PARKCENTER here — the chamber temp sensor lives on the chamber
    # wall, not the toolhead, so toolhead position doesn't affect the
    # sensor reading. Toolhead stays at QGL's last probe position (a
    # corner) during soak. The "park during soak" pattern was load-
    # bearing only when the sensor was on the toolhead and needed a
    # representative-air spot.
    TEMPERATURE_WAIT SENSOR="heater_generic chamber" MINIMUM={(chamber / 2)|int}   # wait for partial warmth, not the full setpoint — see comment above
  {% elif soak_s > 0 %}
    G4 P{(soak_s * 1000)|int}
  {% endif %}

  # 10. Per-filament Z baby-step (optional). Eddy native tap makes this
  #     mostly unnecessary; useful for plate-type compensation (smooth
  #     vs textured) or filament-specific first-layer behavior. The
  #     offset persists across step 12's final G28 Z (SET_GCODE_OFFSET
  #     is kinematic-frame, not bed-frame), so it applies correctly
  #     against the print-authoritative Z reference.
  {% if z_adjust != 0.0 %}
    SET_GCODE_OFFSET Z_ADJUST={z_adjust} MOVE=1
  {% endif %}

  # 11. Adaptive bed mesh over the actual print area. Probed against the
  #     Z reference from step 7's QGL-driven _CG28 home — fine because
  #     mesh values are RELATIVE shape (anchored to zero_reference_position
  #     175,175 per eddy.cfg). When step 12's final tap-Z rebases the
  #     kinematic Z=0, the mesh's anchor follows; the relative shape
  #     compensation stays correct against the new reference. See
  #     [the "Removed pre-mesh tap-Z" amendment in the print-lifecycle
  #     spec for the analysis.](docs/superpowers/specs/2026-05-18-print-lifecycle-redesign.md)
  BED_MESH_CALIBRATE ADAPTIVE=1

  # 12. Final hotend heat + hot nozzle wipe + final tap-Z (print-Z
  #     reference) with hot + clean nozzle. The mesh from step 11 follows
  #     this new Z reference automatically — its shape stays correct
  #     against whatever the current kinematic Z=0 is. M109 (our override)
  #     waits within m109_tolerance_celsius of target.
  #
  #     The G28 Z here is the ONLY pre-print tap that matters for absolute
  #     print accuracy — the earlier _CG28 in step 7 just establishes a
  #     Z home so QGL + mesh can run. Cost: ~10-15s per print. The
  #     homing_override in eddy.cfg handles safe-Z behavior and invokes
  #     SET_Z_FROM_PROBE (multi-sample retry-until-consensus via gcmd args).
  M109 S{extruder}
  M107                                                   # part cooling fan off
  BLOBIFIER_CLEAN                                        # hot wipe = effective wipe
  G28 Z


[gcode_macro PRINT_END]
description: Normal end-of-print cleanup. Retracts, lifts, parks at rear-left, then defers to _PRINT_END_CLEANUP for cooldown + OFF. CANCEL_PRINT mid-print runs _PRINT_END_CLEANUP only (upstream client.cfg handles its own retract+park+heaters-off first).
gcode:
  M400                                                   # flush move buffer
  G92 E0                                                 # zero extruder
  G91                                                    # relative
  G1 E-2 F2700                                           # small retract — clean nozzle disengage
  G1 Z10 F3000                                           # lift 10mm
  G90                                                    # absolute
  G1 X{printer.toolhead.axis_minimum.x + 5} Y{printer.toolhead.axis_maximum.y - 5} F6000   # park rear-left
  TURN_OFF_HEATERS                                       # zeros all heaters including [heater_generic chamber]
  M107                                                   # part fan off
  # TURN_OFF_HEATERS above zeroed the chamber heater target, but did NOT
  # touch _CHAMBER_CONTROL.user_target (which is still whatever the slicer
  # asked for). Calling SET_CHAMBER_TARGET TARGET=0 here syncs user_target
  # back to 0 AND kicks the chamber_control_loop, which then evaluates
  # state: with print no longer active and bed still hot, the loop enters
  # VOC mode and sets the chamber heater target to voc_baseline_temp.
  # That keeps BedFans circulating air through the under-bed filter during
  # the G4 cooldown. Once bed_temp drops below voc_cooldown_threshold the
  # loop transitions to OFF. Without this explicit kick, the loop would
  # never wake up (it self-terminates while user_target > 0), so VOC
  # capture would silently not happen.
  SET_CHAMBER_TARGET TARGET=0
  _PRINT_END_CLEANUP


[gcode_macro _PRINT_END_CLEANUP]
description: Shared cleanup tail — bed mesh clear, cooldown delay, OFF, reset speeds. Called by PRINT_END (after its retract/park/heaters-off) and by upstream CANCEL_PRINT via _CLIENT_VARIABLE.user_cancel_macro.
gcode:
  BED_MESH_CLEAR
  {% set cooldown_ms = printer["gcode_macro _USER_VARIABLE"].print_end_cooldown_seconds|int * 1000 %}
  G4 P{cooldown_ms}
  OFF
  _RESETSPEEDS
