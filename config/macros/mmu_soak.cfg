# Temporary: no-filament MMU soak under print-like conditions, for the selector
# TMC "GSTAT reset=1" investigation (2026-11). Remove once the investigation closes.
# Unload ALL filament first (HH must report filament unloaded). A driver reset
# still shuts Klipper down, and that shutdown is the test result.
#
# Example: MMU_SOAK GATE=4 HOURS=3 BED=110 EXTRUDER=250 CHAMBER=50
#
# Servo: HH raises the servo at the end of every gear test move when no filament
# is loaded (reset_sync_gear_to_extruder(force_grip=True) with sync impossible),
# so it can't be held down between moves. Long moves (default 6000 mm, about
# 5 min each) keep it down for over 99% of the run: one down/up cycle per move.
#
# If a tick errors, the loop stops (gcode errors can't be caught). The 15 min
# idle timeout set below then parks and turns everything OFF. Run MMU_SOAK_STOP
# afterwards to restore the configured idle timeout.

[gcode_macro MMU_SOAK]
description: No-filament MMU soak - servo down, gear turning, heaters on. MMU_SOAK_STOP ends it
variable_running: 0
variable_tick: 0
variable_ticks: 0
variable_sel_every: 2
variable_gate: 4
variable_move: 6000
variable_speed: 20
gcode:
  {% set gate = params.GATE|default(4)|int %}
  {% set hours = params.HOURS|default(3)|float %}
  {% set move = [params.MOVE|default(6000)|float, 10]|max %}
  {% set speed = [params.SPEED|default(20)|float, 1]|max %}
  {% set tick_s = move / speed %}
  {% set ticks = [(hours * 3600 / tick_s)|int, 1]|max %}
  {% set sel_every = [(600 / tick_s)|int, 1]|max %}
  {% set mmu = printer.mmu %}
  {% if not mmu.enabled %}
    {action_raise_error("MMU_SOAK: MMU is disabled")}
  {% elif gate < 0 or gate >= mmu.num_gates %}
    {action_raise_error("MMU_SOAK: GATE must be 0 to %d" % (mmu.num_gates - 1))}
  {% elif mmu.filament_pos != 0 %}
    {action_raise_error("MMU_SOAK: HH does not report filament unloaded - unload first")}
  {% endif %}
  MMU_SELECT GATE={gate}
  SET_GCODE_VARIABLE MACRO=MMU_SOAK VARIABLE=gate VALUE={gate}
  SET_GCODE_VARIABLE MACRO=MMU_SOAK VARIABLE=move VALUE={move}
  SET_GCODE_VARIABLE MACRO=MMU_SOAK VARIABLE=speed VALUE={speed}
  SET_GCODE_VARIABLE MACRO=MMU_SOAK VARIABLE=ticks VALUE={ticks}
  SET_GCODE_VARIABLE MACRO=MMU_SOAK VARIABLE=sel_every VALUE={sel_every}
  SET_GCODE_VARIABLE MACRO=MMU_SOAK VARIABLE=tick VALUE=0
  SET_GCODE_VARIABLE MACRO=MMU_SOAK VARIABLE=running VALUE=1
  # Short backstop, not an extension: HH gear moves dwell the main toolhead, so
  # the idle timer can't expire while the loop runs
  SET_IDLE_TIMEOUT TIMEOUT=900
  M140 S{params.BED|default(110)|int}
  M104 S{params.EXTRUDER|default(250)|int}
  SET_CHAMBER_TARGET TARGET={params.CHAMBER|default(50)|int}
  RESPOND MSG="MMU_SOAK - gate {gate}, {ticks} x {move}mm at {speed}mm/s, about {hours}h. If progress lines stop, the loop died - idle timeout turns everything OFF in 15 min"
  UPDATE_DELAYED_GCODE ID=_mmu_soak_tick DURATION=1

# One gear move per tick; every sel_every ticks the selector moves away and back.
# The guard runs at the start of each tick, so it checks the previous tick's result
# (including that the selector came back to the soak gate).
[delayed_gcode _mmu_soak_tick]
gcode:
  {% set s = printer["gcode_macro MMU_SOAK"] %}
  {% set mmu = printer.mmu %}
  {% if s.running %}
    {% if not mmu.enabled or mmu.gate != s.gate or mmu.filament_pos != 0 %}
      RESPOND TYPE=error MSG="MMU_SOAK aborted at move {s.tick} - enabled={mmu.enabled} gate={mmu.gate} filament_pos={mmu.filament_pos}"
      MMU_SOAK_STOP
    {% elif s.tick >= s.ticks %}
      MMU_SOAK_STOP
    {% else %}
      MMU_TEST_MOVE MOVE={s.move if s.tick % 2 == 0 else -s.move} SPEED={s.speed}
      {% if s.tick % s.sel_every == s.sel_every - 1 %}
        MMU_SELECT GATE={0 if s.gate != 0 else 1}
        MMU_SELECT GATE={s.gate}
      {% endif %}
      RESPOND MSG="MMU_SOAK - {s.tick + 1}/{s.ticks} moves done, no reset so far"
      SET_GCODE_VARIABLE MACRO=MMU_SOAK VARIABLE=tick VALUE={s.tick + 1}
      UPDATE_DELAYED_GCODE ID=_mmu_soak_tick DURATION=0.5
    {% endif %}
  {% endif %}

[gcode_macro MMU_SOAK_STOP]
description: End the MMU soak - heaters off, servo up, idle timeout restored
gcode:
  SET_GCODE_VARIABLE MACRO=MMU_SOAK VARIABLE=running VALUE=0
  UPDATE_DELAYED_GCODE ID=_mmu_soak_tick DURATION=0
  M140 S0
  M104 S0
  SET_CHAMBER_TARGET TARGET=0
  SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout|int}
  MMU_SERVO POS=up
  RESPOND MSG="MMU_SOAK stopped after {printer['gcode_macro MMU_SOAK'].tick} moves"
