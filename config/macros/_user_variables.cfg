# Single source of truth for printer-level tunables (Phase 4 PR-B).
# Edit values here; consumers read via printer["gcode_macro _USER_VARIABLE"].X.
#
# printer[...].X is resolved at macro invocation, not config parse, so
# include order doesn't affect correctness — printer.cfg lists this file
# first only for readability. Each consuming macro reads at its own
# invocation, so the render-once-per-macro Jinja rule (CLAUDE.md
# "Klipper gotchas") doesn't apply.
#
# Aliasing this macro (e.g. `{% set uv = printer["gcode_macro
# _USER_VARIABLE"] %}` then `uv.X`) is forbidden by
# test_no_user_variable_alias_pattern — the alias bypasses Layer 5 ref
# tripwires. Inline the lookup at each read site.
#
# Values here are copied verbatim from their previous hardcoded sites:
#   bedfans_*                  was [_BEDFANVARS] in bedfans.cfg
#   heatsoak_default_*         were HEATSOAK params.T/C defaults in macros.cfg
#   m109_tolerance_celsius     was the +1 in M109's MAXIMUM={s+1} in macros.cfg
#   m190_tolerance_celsius     was the +5 in M190's MAXIMUM={S|int+5} in bedfans.cfg
#   chamber_wait_bed_threshold was the literal 90 in PRINT_START's bed check
#   print_end_cooldown_seconds was the 60000 in PRINT_END's G4 P60000

[gcode_macro _USER_VARIABLE]
description: Single source of truth for printer-level tunables.
# Bed fans
variable_bedfans_threshold: 100      # bed target above which fans run
variable_bedfans_fast: 0.6           # fan speed after target reached
variable_bedfans_slow: 0.2           # fan speed while heater ramps
# HEATSOAK defaults
variable_heatsoak_default_bed_target: 110
variable_heatsoak_default_chamber_target: 30
# Heater wait tolerance bands (°C). Bed runs wider than hotend because
# bed PID overshoots more on a large thermal mass.
variable_m109_tolerance_celsius: 1
variable_m190_tolerance_celsius: 5
# PRINT_START / PRINT_END pacing
variable_chamber_wait_bed_threshold: 90   # bed temp above which we wait for chamber
variable_print_end_cooldown_seconds: 60   # PRINT_END "let things circulate" delay
gcode:
  # Variables-only macro; no body.
