#####################################################################
#   Chamber control — single owner of BedFans + temperature_fan chamber
#
#   Spec: docs/superpowers/specs/2026-05-18-chamber-control-design.md
#
#   _CHAMBER_CONTROL holds the live setpoint.
#   SET_CHAMBER_TARGET is the only entry point that mutates the setpoint
#   (PRINT_START, PRINT_END, _CANCEL_PRINT_HOOK, manual console, OFF).
#   chamber_control_loop ticks every 5s (30s when idle) and writes fan
#   state based on {target, chamber temp, bed temp, print state}. The
#   loop is also bootstrapped directly via UPDATE_DELAYED_GCODE from
#   PRINT_START step 4 so VOC baseline can engage before the slicer
#   passes CHAMBER>0.
#####################################################################

[gcode_macro _CHAMBER_CONTROL]
description: State holder for chamber control. variable_target is the live setpoint. variable_heating tracks HEAT-vs-MAINTAIN to give the loop proper hysteresis (enter HEAT at target-band, exit at target). Static knobs live in _USER_VARIABLE.
variable_target: 0
variable_heating: 0
gcode:
  # Variables-only macro; no body. Same pattern as _USER_VARIABLE.


[gcode_macro SET_CHAMBER_TARGET]
description: Set the chamber temperature setpoint. TARGET=0 disables active control (loop runs only for VOC baseline / cooldown). Clamped to [0, chamber_max_target].
gcode:
  {% set req = params.TARGET|default(0)|float %}
  {% set cap = printer["gcode_macro _USER_VARIABLE"].chamber_max_target|float %}
  {% if req < 0 %}
    {% set target = 0 %}
    M117 chamber target {req|int} clamped to 0
    RESPOND TYPE=echo MSG="SET_CHAMBER_TARGET: negative TARGET ({req|int}); clamped to 0."
  {% elif req > cap %}
    {% set target = cap %}
    M117 chamber target {req|int} clamped to {cap|int}
    RESPOND TYPE=echo MSG="SET_CHAMBER_TARGET: requested {req|int} exceeds chamber_max_target ({cap|int}); clamped."
  {% else %}
    {% set target = req %}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_CHAMBER_CONTROL VARIABLE=target VALUE={target}
  UPDATE_DELAYED_GCODE ID=chamber_control_loop DURATION=1


[delayed_gcode chamber_control_loop]
gcode:
  {% set target           = printer["gcode_macro _CHAMBER_CONTROL"].target|float %}
  {% set heating          = printer["gcode_macro _CHAMBER_CONTROL"].heating|int %}
  {% set band             = printer["gcode_macro _USER_VARIABLE"].chamber_target_band|float %}
  {% set baseline_speed   = printer["gcode_macro _USER_VARIABLE"].chamber_voc_baseline|float %}
  {% set heat_speed       = printer["gcode_macro _USER_VARIABLE"].chamber_heat_speed|float %}
  {% set voc_cooldown_bed = printer["gcode_macro _USER_VARIABLE"].voc_cooldown_threshold|float %}
  {% set chamber_temp     = printer["temperature_fan chamber"].temperature|float %}
  {% set bed_temp         = printer.heater_bed.temperature|float %}
  {% set state            = printer.print_stats.state|string %}
  {% set print_active     = state in ("printing", "paused") %}

  # Active control with hysteresis. The heating flag in _CHAMBER_CONTROL
  # tracks whether we are currently in the HEAT branch; entry threshold is
  # target-band, exit threshold is target. Effective dead-zone of `band` °C
  # so BedFans do not flap between heat_speed and baseline_speed around a
  # single boundary (the prior single-threshold logic caused ~30s
  # fast/slow cycling at the target-band line).
  #
  # HEAT forces BedFans high and disables the chamber temperature_fan PID
  # so we do not fight ourselves. In MAINTAIN we hand the target to the
  # PID and run BedFans at the VOC baseline.
  {% if target > 0 %}
    {% if heating == 1 %}
      # In HEAT mode: exit when chamber reaches target.
      {% if chamber_temp >= target %}
        SET_GCODE_VARIABLE MACRO=_CHAMBER_CONTROL VARIABLE=heating VALUE=0
        SET_FAN_SPEED FAN=BedFans SPEED={baseline_speed}
        SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber TARGET={target}
      {% else %}
        SET_FAN_SPEED FAN=BedFans SPEED={heat_speed}
        SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber TARGET=0
      {% endif %}
    {% else %}
      # In MAINTAIN mode: enter HEAT when chamber falls below target-band.
      {% if chamber_temp < target - band %}
        SET_GCODE_VARIABLE MACRO=_CHAMBER_CONTROL VARIABLE=heating VALUE=1
        SET_FAN_SPEED FAN=BedFans SPEED={heat_speed}
        SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber TARGET=0
      {% else %}
        SET_FAN_SPEED FAN=BedFans SPEED={baseline_speed}
        SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber TARGET={target}
      {% endif %}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=chamber_control_loop DURATION=5
  # VOC baseline: filtration during prints + cooldown.
  {% elif print_active or bed_temp >= voc_cooldown_bed %}
    SET_GCODE_VARIABLE MACRO=_CHAMBER_CONTROL VARIABLE=heating VALUE=0
    SET_FAN_SPEED FAN=BedFans SPEED={baseline_speed}
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber TARGET=0
    UPDATE_DELAYED_GCODE ID=chamber_control_loop DURATION=5
  # OFF: idle + bed cold. Re-arm at 30s — slower than active states but
  # still alive so the loop wakes up if the bed is reheated outside
  # SET_CHAMBER_TARGET (manual M140 from Mainsail console, HEATSOAK, etc.)
  # and VOC baseline can engage.
  {% else %}
    SET_GCODE_VARIABLE MACRO=_CHAMBER_CONTROL VARIABLE=heating VALUE=0
    SET_FAN_SPEED FAN=BedFans SPEED=0
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber TARGET=0
    UPDATE_DELAYED_GCODE ID=chamber_control_loop DURATION=30
  {% endif %}
