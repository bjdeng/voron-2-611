#####################################################################
#   Chamber control — the user-facing SET_CHAMBER_TARGET API.
#
#   [heater_generic chamber] in bed.cfg owns the BedFans PWM pin (z:P2.5)
#   and runs PID against the chamber thermistor (z:P0.24). That PID is the
#   ENTIRE chamber controller — there is no polling loop and no VOC baseline.
#   SET_CHAMBER_TARGET just clamps the requested setpoint and hands it to the
#   heater; TARGET=0 turns BedFans off.
#
#   VOC capture during cooldown is handled by PRINT_END holding the print's
#   own chamber target through the cooldown G4 (see print_start.cfg), not by
#   a separate baseline here. Spec:
#   docs/superpowers/specs/2026-05-28-chamber-cooldown-hold-target.md
#####################################################################

[gcode_macro SET_CHAMBER_TARGET]
description: Set the chamber heater ([heater_generic chamber]) target. Clamps to [0, chamber_max_target]. The PID owns continuous control; TARGET=0 turns BedFans off.
gcode:
  {% set chamber_max_target = printer["gcode_macro _USER_VARIABLE"].chamber_max_target|float %}
  {% set requested = params.TARGET|default(0)|float %}
  {% set target = [[requested, 0]|max, chamber_max_target]|min %}
  {% if requested > chamber_max_target %}
    M117 Chamber target {requested}>{chamber_max_target}, clamping
    RESPOND TYPE=echo MSG="Chamber target {requested}°C exceeds chamber_max_target ({chamber_max_target}°C); clamped to {target}°C."
  {% elif requested < 0 %}
    M117 Chamber target {requested}<0, clamping
    RESPOND TYPE=echo MSG="Chamber target {requested}°C is negative; clamped to 0°C (OFF)."
  {% endif %}
  # Route to the raw (renamed) builtin, NOT SET_HEATER_TEMPERATURE — the
  # bedfans.cfg override sends HEATER=chamber back here, which would recurse.
  _SET_HEATER_TEMPERATURE HEATER=chamber TARGET={target}
