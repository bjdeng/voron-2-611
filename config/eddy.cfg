[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_5044340310B85E1C-if00
restart_method: command

[probe_eddy_current btt_eddy]
sensor_type: ldc1612
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: 0
y_offset: 21.42
descend_z: 0.5
reg_drive_current: 15   # carried over from prior eddy-ng calibration (same LDC1612 register).
                        # Re-run LDC_CALIBRATE_DRIVE_CURRENT only if probing shows abnormal sensitivity.
# tap_threshold populated by PROBE_EDDY_CURRENT_TAP_CALIBRATE.
# Freq→Z mapping populated by PROBE_EDDY_CURRENT_CALIBRATE_AUTO.

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

# Coil-adjacent thermistor on the BTT Eddy board, used by [temperature_probe btt_eddy]
# (below) for thermal drift compensation. Section names must match the
# [probe_eddy_current btt_eddy] postfix — see vendor/klipper/docs/Eddy_Probe.md:451-470.
# Replaces the prior [temperature_sensor btt_eddy] which used the same pin.
[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
min_temp: 10
max_temp: 100
calibration_position: 175, 175, 3      # bed center; Z 3mm for paper test
calibration_bed_temp: 110              # max safe bed temp (max_temp is 120)
calibration_extruder_temp: 200         # hotend during calibration (matches Eddy plan)
extruder_heating_z: 30                 # park height while hotend heats
max_validation_temp: 110               # enclosed printer (docs recommend 100-120)

[bed_mesh]
horizontal_move_z: 2
speed: 200
# For the mesh dimensions below, the coordinates need to be reachable by the center of the probe. To calculate coordinates that will work, use the formula below:
# mesh x min = position_min_x + greater_of (15mm or x_offset) <--- in this term, only consider the x offset if it is positive, ignore if negative.
# mesh y min = position_min_y + greater_of (15mm or y_offset) <--- in this term, only consider the y offset if it is positive, ignore if negative.
# mesh x max = position_max_x - greater_of (15mm or |x_offset|) <--- in this term, only consider the x offset if it is negative, ignore if positive.
# mesh y max = position_max_y - greater_of (15mm or |y_offset|) <--- in this term, only consider the y offset if it is negative, ignore if positive.
mesh_min: 15, 21.42  # modify these according to the above guide. If the probe cannot reach then you will get a klipper error when trying to scan a bed mesh.
mesh_max: 335, 330 # modify these according to the above guide. If the probe cannot reach then you will get a klipper error when trying to scan a bed mesh.
probe_count: 9, 9
algorithm: bicubic
fade_start: 0.26
fade_end: 5
fade_target: 0                  # explicit zero plane for fade (with tap, this matches the tap Z reference)
zero_reference_position: 175, 175    # tap location → bed_mesh zero plane (matches safe_z_home)
adaptive_margin: 5
scan_overshoot: 8  #uncomment this section if you still have room left over on the X axis for some scan overshoot to product smoother movements and more accurate scanning. Uncommenting this should be fine if you are using a standard voron mount.

# [safe_z_home] is replaced by the [homing_override] below — Klipper
# refuses to load with both ("homing_override and safe_z_homing cannot
# be used simultaneously"). The override's gcode replicates safe_z_home's
# behavior (raise Z, move XY to bed center, home Z) AND adds the
# SET_Z_FROM_PROBE tap-correction step.

# Eddy is the probe AND the Z endstop ([stepper_z]'s endstop_pin in
# config/printer.cfg is probe:z_virtual_endstop). force_move lets us
# nudge Z manually during initial calibration when no other Z reference
# exists yet.
[force_move]
enable_force_move: True

# Doc-blessed pattern for applying tap result as the Z reference
# (vendor/klipper/docs/Eddy_Probe.md:379-389).
# Split into TWO macros because Klipper renders each macro's jinja
# template ONCE at invocation — references inside one macro body
# can't see results from a PROBE that runs earlier in the same body.
# Call _RELOAD_Z_OFFSET_FROM_PROBE AFTER PROBE so its jinja sees the
# fresh last_probe_position.
[gcode_macro _RELOAD_Z_OFFSET_FROM_PROBE]
description: Apply the most recent probe result as the Z reference.
gcode:
    {% set Z = printer.toolhead.position.z %}
    SET_KINEMATIC_POSITION Z={Z - printer.probe.last_probe_position.z}

[gcode_macro SET_Z_FROM_PROBE]
description: Tap-probe Z and apply the result as the Z reference (use after G28 Z).
gcode:
    PROBE METHOD=tap
    _RELOAD_Z_OFFSET_FROM_PROBE

# Klipper docs recommend [homing_override] when using an Eddy probe so the
# tap-Z correction macro fires after EVERY G28 Z — not just at print start.
# Without this, an ad-hoc `G28 Z` from the Mainsail console (or any macro
# that homes Z) leaves the internal Z position uncorrected, which can cause
# nozzle/bed collisions on the next move (Eddy_Probe.md:391-400).
#
# axes: z scopes the override to commands that home Z (`G28`, `G28 Z`,
# `G28 Z0`). `G28 X` / `G28 Y` alone bypass the override and use Klipper's
# normal per-axis homing. Inside the override, `G28 X` / `G28 Y` / `G28 Z`
# invoke Klipper's NORMAL homing procedure (not the override recursively).
#
# This override REPLACES [safe_z_home] (which can't coexist with
# homing_override). It replicates the safe-Z behavior: raise Z if homed,
# home XY if not homed, move to (175, 175), home Z, apply tap.
[homing_override]
axes: z
gcode:
    # 1. Raise Z first if Z is already homed — avoids scraping bed when
    #    the override fires from a position close to bed (e.g. after QGL).
    #    Matches the old safe_z_home `z_hop: 10` + `z_hop_speed: 25`.
    {% if "z" in printer.toolhead.homed_axes %}
        G90
        G1 Z10 F1500
    {% endif %}

    # 2. Home X+Y if not already. safe_z_home required them before lowering;
    #    same constraint here because the XY move below needs homed axes.
    {% if "x" not in printer.toolhead.homed_axes %}
        G28 X
    {% endif %}
    {% if "y" not in printer.toolhead.homed_axes %}
        G28 Y
    {% endif %}

    # 3. Move to bed center for Z home (matches old safe_z_home
    #    `home_xy_position: 175, 175` + `speed: 200`).
    G90
    G1 X175 Y175 F12000

    # 4. Home Z (Klipper's normal G28 Z; probe:z_virtual_endstop triggers).
    G28 Z

    # 5. Apply tap correction — the whole point of this override.
    SET_Z_FROM_PROBE

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
# Two-pass override. The first pass uses METHOD=default (descend probing)
# because horizontal_move_z=8 is OUTSIDE our calibrated freq→Z range
# (PROBE_EDDY_CURRENT_CALIBRATE only covers ~0.25–3.0 mm). Scan-based
# probing at Z=8 errors with "sensor not in valid range".
#
# The second pass at Z=2 is within the calibrated range, so METHOD=scan
# is fast and safe — no per-point Z descent, sensor reads at fixed Z.
#
# To make BOTH passes scan-based later: re-run PROBE_EDDY_CURRENT_CALIBRATE
# with the toolhead positioned higher (~10 mm above bed) so the polynomial
# covers Z=0.05 → 10 mm, then we can drop METHOD=default below.
#
# Two-pass is load-bearing for this machine (A/B motor weight sags the rear
# when motors are off; see memory/qgl-two-pass-intentional.md).
gcode:
  SAVE_GCODE_STATE NAME=STATE_QGL
  BED_MESH_CLEAR
  {% if not printer.quad_gantry_level.applied %}
    _QUAD_GANTRY_LEVEL horizontal_move_z=8 retry_tolerance=1
  {% endif %}
  _QUAD_GANTRY_LEVEL horizontal_move_z=2 METHOD=scan
  RESTORE_GCODE_STATE NAME=STATE_QGL

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BTT_BED_MESH_CALIBRATE
gcode:
 BTT_BED_MESH_CALIBRATE ADAPTIVE=1 METHOD=rapid_scan
