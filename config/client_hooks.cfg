##### _CLIENT_VARIABLE — hooks consumed by upstream Mainsail client.cfg #####
#
# This file MUST live outside mainsail.cfg. On the Pi, mainsail.cfg is a
# symlink to ~/mainsail-config/client.cfg (upstream-managed); our deploy
# script's symlink-discovery correctly excludes it from rsync. Anything
# we put in mainsail.cfg therefore never reaches the Pi. The symlink-
# safety rule is documented in CLAUDE.md "How to help me" §7 and in
# scripts/deploy_to_pi.sh's PI_SYMLINK_EXCLUDES. PR #70's first deploy
# attempt fell into this trap; PR #71 (this file) is the fix.
#
# Upstream Mainsail client.cfg looks up these variables via
# `printer['gcode_macro _CLIENT_VARIABLE']|default({})` and calls
# user_cancel_macro / user_pause_macro / user_resume_macro at the right
# moments. Without _CLIENT_VARIABLE defined, the hooks default to empty
# strings — cancel-mid-print runs only upstream's bare retract+park+
# heaters-off and skips our cooldown / OFF / _RESETSPEEDS entirely.
#
# Wiring user_cancel_macro to _CANCEL_PRINT_HOOK gives cancel a clean
# MMU-aware shutdown. See spec 2026-05-18 §5 + 2026-05-18 follow-up
# (MMU unload on cancel).
#
# Cancel order (per vendor/mainsail-config/mainsail.cfg ~line 82-86):
#   1. CANCEL_PRINT body: _TOOLHEAD_PARK_PAUSE_CANCEL → _CLIENT_RETRACT
#   2. TURN_OFF_HEATERS + M106 S0      (heaters commanded off here)
#   3. {client.user_cancel_macro}      ← OUR HOOK runs now
#   4. CANCEL_PRINT_BASE               (Klipper base cancel)
# So by the time _CANCEL_PRINT_HOOK fires, heaters are already commanded
# off; MMU_UNLOAD (called by MMU_END) will re-heat the extruder to its
# mmu_default temp via _ensure_safe_extruder_temperature, unload, then
# _PRINT_END_CLEANUP turns everything off again. Cancel is therefore
# slower than "stop now" (1–2 min) but leaves the printer in a known-
# clean state with no filament in the toolhead.
#
# Pause/cancel park position is set to MATCH PRINT_END's park (rear-left
# corner) for consistency — the operator always knows where the toolhead
# will sit when a print stops, regardless of how it stopped. Without
# use_custom_pos=true the upstream default would park at the rear-right
# corner (max.x - 5, max.y - 5), which diverges from PRINT_END's rear-left
# (axis_minimum.x + 5, axis_maximum.y - 5). Values below match the
# [printer] axis_maximum on this build (350 x 355 effective); update both
# this file and PRINT_END's park line if the build dimensions ever change.

[gcode_macro _CLIENT_VARIABLE]
description: Holds variables consumed by the upstream Mainsail client.cfg hooks. user_cancel_macro is the load-bearing one; use_custom_pos / custom_park_x / custom_park_y align pause park with PRINT_END.
variable_user_cancel_macro: "_CANCEL_PRINT_HOOK"
variable_use_custom_pos: True
variable_custom_park_x: 5.0
variable_custom_park_y: 350.0
gcode:
  # Variables-only macro; no body. Same pattern as _USER_VARIABLE.


[gcode_macro _CANCEL_PRINT_HOOK]
description: Runs when CANCEL_PRINT fires mid-print, AFTER upstream commands heaters off but BEFORE base cancel. Syncs chamber control state, calls MMU_END UNLOAD=1 (HH re-heats extruder as needed and unloads filament) then defers to _PRINT_END_CLEANUP for VOC cooldown + OFF + _RESETSPEEDS. Total cancel runtime is ~1–2 min; trades speed for a clean-printer state.
gcode:
  # Upstream CANCEL_PRINT already called TURN_OFF_HEATERS before this hook,
  # zeroing the [heater_generic chamber] target. But _CHAMBER_CONTROL.
  # user_target is still set to whatever the slicer asked for, and the
  # chamber_control_loop self-terminates while user_target > 0. Without
  # this sync, the loop would never wake to engage VOC mode during the
  # cooldown G4.
  #
  # SET_CHAMBER_TARGET TARGET=0 syncs user_target → 0 and kicks the loop,
  # which then evaluates state (print not active, bed still hot) and
  # enters VOC mode for the cooldown. Matches the PRINT_END pattern.
  SET_CHAMBER_TARGET TARGET=0
  # MMU_END is Happy-Hare's canonical end-of-print hook. UNLOAD=1 forces
  # filament unload from the toolhead. The macro internally checks
  # printer.mmu.enabled, so it's safe to call unconditionally — non-MMU
  # builds will no-op.
  MMU_END UNLOAD=1
  _PRINT_END_CLEANUP
