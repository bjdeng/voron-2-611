## Display subsystem — fysetc Mini12864 on the main MCU's EXP1/EXP2 headers.
##
## - [board_pins]                  EXP1/EXP2 pin aliases (consumed only by
##                                 the sections below).
## - [display]                     uc1701 LCD; encoder + click; renders the
##                                 __voron_display group from lcd_tweaks.cfg.
## - [output_pin beeper]
## - [neopixel lcd]                3-LED chain on the display backboard.
##
## SB-LED chain on the toolhead is NOT here — there is no SB-LED on this build
## today (only the LCD neopixels above). If SB LEDs are added in the future,
## they belong in toolhead.cfg (they live on the EBB MCU's neopixel pin), not
## here — that's the feature-axis grouping per the dual-axis rule in CLAUDE.md.

#####################################################################
#   Displays
#####################################################################
# BJD 9/8/2020 per https://discord.com/channels/460117602945990666/460172848565190667/724803977790750750
# Code for mini12864 display on SKR1.4
[board_pins]
aliases:
    # EXP1 header
    EXP1_1=P1.30, EXP1_3=P1.18, EXP1_5=P1.20, EXP1_7=P1.22, EXP1_9=<GND>,
    EXP1_2=P0.28, EXP1_4=P1.19, EXP1_6=P1.21, EXP1_8=P1.23, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=P0.17, EXP2_3=P3.26, EXP2_5=P3.25, EXP2_7=P1.31, EXP2_9=<GND>,
    EXP2_2=P0.15, EXP2_4=P0.16, EXP2_6=P0.18, EXP2_8=<RST>, EXP2_10=<NC>

[display]
lcd_type: uc1701
cs_pin: EXP1_3
a0_pin: EXP1_4
rst_pin: EXP1_5
contrast: 63
encoder_pins: ^EXP2_5, ^EXP2_3
click_pin: ^!EXP1_2
display_group: __voron_display
menu_timeout: 60

[output_pin beeper]
pin: EXP1_1

# fysetc_mini12864
[neopixel lcd]
pin: EXP1_6
chain_count: 3
color_order: RGB
initial_RED: 0.4 ;0.0
initial_GREEN: 0.4 ;0.0
initial_BLUE: 0.4 ; 0.0
