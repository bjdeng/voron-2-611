[include chopper_tune.cfg]
## Above line added by chopper-resonance-tuner install.sh (issue #98 Session 1).
## Pulls in the gcode_macro library at the Pi symlink:
## ~/printer_data/config/chopper_tune.cfg -> ~/chopper-resonance-tuner/chopper_tune.cfg.
## The symlink is auto-excluded from rsync by scripts/deploy_to_pi.sh's symlink discovery,
## so the .cfg file itself stays Pi-only.
##
## install.sh ALSO added a [respond] declaration here; intentionally dropped — [respond]
## is already declared via the upstream mainsail.cfg symlink, and config-structure test
## (test_status_sections_declared_at_most_once) rejects duplicate declarations.

## Voron Design VORON2 250/300/350mm SKR 1.4 TMC2209 UART config

## Klipper Config docs:
## https://github.com/Klipper3d/klipper/blob/master/docs/Config_Reference.md- BJD

##  Obtain mcu definitions with "ls -l /dev/serial/by-id/" then unplug to verify

##  MCU for X/Y steppers main MCU
[mcu]
serial: /dev/serial/by-id/usb-Klipper_lpc1769_05E0FF1627903CAF12CA6D5CC62000F5-if00

##  MCU for Z steppers
[mcu z]
serial: /dev/serial/by-id/usb-Klipper_lpc1769_1560011845084AAF45F07F5DC52000F5-if00


#####################################################################
#   File includes
#####################################################################
# Mainboard-resident subsystems (function-organized — see CLAUDE.md `## Repo layout`)
[include motion.cfg]      # kinematics + steppers + TMCs + input shaping
[include bed.cfg]         # bed heater + chamber thermal + QGL + controller fan
[include display.cfg]     # mini12864 LCD, beeper, neopixel
[include system.cfg]      # raspberry pi temp, caselight, idle timeout

# Toolhead MCU (EBB SB v1.0 on USB)
[include toolhead.cfg]

# Probe + bed leveling + homing override
[include eddy.cfg]

# MMU (Happy Hare)
[include mmu/base/*.cfg]
[include mmu/optional/client_macros.cfg]
[include mmu/optional/mmu_menu.cfg]
[include mmu/addons/blobifier.cfg]

# Client (Mainsail + timelapse)
[include mainsail.cfg]
[include timelapse.cfg]
[include client_hooks.cfg]    # _CLIENT_VARIABLE + _CANCEL_PRINT_HOOK — wires upstream client.cfg into our cleanup tail

# User tunables. printer["gcode_macro _USER_VARIABLE"].X resolves at
# macro invocation, so include order isn't load-bearing — kept first
# for readability.
[include macros/_user_variables.cfg]

# Macros
[include macros/macros.cfg]
[include macros/test_speed.cfg]
[include macros/lcd_tweaks.cfg]
[include macros/bedfans.cfg]
[include macros/chamber_control.cfg]
[include macros/print_start.cfg]
[include macros/calibrate_flow.cfg]
[include macros/calibrate_pa.cfg]

