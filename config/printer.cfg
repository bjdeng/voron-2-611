## Voron Design VORON2 250/300/350mm SKR 1.4 TMC2209 UART config

## Klipper Config docs:
## https://github.com/Klipper3d/klipper/blob/master/docs/Config_Reference.md- BJD

## *** THINGS TO CHANGE/CHECK: ***
## MCU paths                            [mcu] section
## Thermistor types                     [extruder] and [heater_bed] sections - See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types
## Z Endstop Switch location            [safe_z_home] section
## Homing end position                  [gcode_macro G32] section
## Z Endstop Switch  offset for Z0      [stepper_z] section
## Probe points                         [quad_gantry_level] section
## Min & Max gantry corner postions     [quad_gantry_level] section
## PID tune                             [extruder] and [heater_bed] sections
## Fine tune E steps                    [extruder] section

## Adjust belts at X175, Y18, Z215
## XY: 110HZ
## Z:  140HZ

##========================== Pin Definitions ========================
## X_STEP_PIN         2.2
## X_DIR_PIN          2.6
## X_ENABLE_PIN       2.1
## X_STOP_PIN         1.29
## E0_DET_PIN         1.26
## X_UART_PIN         1.10


## Y_STEP_PIN         0.19
## Y_DIR_PIN          0.20
## Y_ENABLE_PIN       2.8
## Y_STOP_PIN         1.28
## E1_DET_PIN         1.26
## Y_UART_RX          1.9


## Z_STEP_PIN         0.22
## Z_DIR_PIN          2.11
## Z_ENABLE_PIN       0.21
## Z_STOP_PIN         1.27
## PWR_DET_PIN        1.0
## Z_UART             1.8


## E0_STEP_PIN        2.13
## E0_DIR_PIN         0.11
## E0_ENABLE_PIN      2.12
## E0_UART            1.4


## E1_STEP_PIN        1.15
## E1_DIR_PIN         1.14
## E1_ENABLE_PIN      1.16
## E1_UART_RX         1.1


## HE1                2.4
## HE0                2.7
## BED                2.5
## TH1 (H1 Temp)      0.23
## TH0 (H0 Temp)      0.24
## TB  (Bed Temp)     0.25
## FAN                2.3
## SERVO              2.0
## PROBE              0.10
##===================================================================
##  Obtain mcu definitions with "ls -l /dev/serial/by-id/" then unplug to verify

##  MCU for X/Y steppers main MCU
[mcu]
serial: /dev/serial/by-id/usb-Klipper_lpc1769_05E0FF1627903CAF12CA6D5CC62000F5-if00

##  MCU for Z steppers
[mcu z]
serial: /dev/serial/by-id/usb-Klipper_lpc1769_1560011845084AAF45F07F5DC52000F5-if00

[printer]
kinematics: corexy
max_velocity: 450
max_accel: 10000
minimum_cruise_ratio: 0.5    # this is the klipper default
max_z_velocity: 100			 # Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350   			 # Max ?
square_corner_velocity: 5.0  # Can experiment with 8.0, default 5.0

# [pause_resume]
# [display_status]

#####################################################################
#   X/Y Stepper Settings
#####################################################################
##  Connected to X on mcu_xye (B Motor)
[stepper_x]
step_pin: P2.2
dir_pin: !P2.6
enable_pin: !P2.1
rotation_distance: 40
microsteps: 128
full_steps_per_rotation: 200
endstop_pin: ^EBB:gpio13
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 80
second_homing_speed: 15
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: P1.10
interpolate: False
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##  Connected to Y on mcu_xye (A Motor)
[stepper_y]
step_pin: P0.19
dir_pin: !P0.20
enable_pin: !P2.8
rotation_distance: 40
microsteps: 128
full_steps_per_rotation:200
endstop_pin: P1.29
position_min: 0
position_endstop: 355
position_max: 355
homing_speed: 80
second_homing_speed: 15
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: P1.9
interpolate: False
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
#   Z Stepper Settings
#####################################################################
## Z MCU - In X Position
## Z0 Stepper - Front Left
[stepper_z]
step_pin: z:P2.2
dir_pin: !z:P2.6
enable_pin: !z:P2.1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 128
endstop_pin: probe:z_virtual_endstop
position_max: 330
position_min: -5
homing_speed: 15.0
second_homing_speed: 3.0
homing_retract_dist: 2.0

[tmc2209 stepper_z]
uart_pin: z:P1.10
interpolate: False
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z MCU - In Y Position
##  Z1 Stepper - Rear Left
[stepper_z1]
step_pin: z:P0.19
dir_pin: z:P0.20
enable_pin: !z:P2.8
rotation_distance: 40
gear_ratio: 80:16
microsteps: 128

[tmc2209 stepper_z1]
uart_pin: z:P1.9
interpolate: False
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z MCU - In Z Position
##  Z2 Stepper - Rear Right
[stepper_z2]
step_pin: z:P0.22
dir_pin: !z:P2.11
enable_pin: !z:P0.21
rotation_distance: 40
gear_ratio: 80:16
microsteps: 128

[tmc2209 stepper_z2]
uart_pin: z:P1.8
interpolate: False
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z MCU - In E0 Position
##  Z3 Stepper - Front Right
[stepper_z3]
step_pin: z:P2.13
dir_pin: z:P0.11
enable_pin: !z:P2.12
rotation_distance: 40
gear_ratio: 80:16
microsteps: 128

[tmc2209 stepper_z3]
uart_pin: z:P1.4
interpolate: False
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
# 	Input Shaping
#####################################################################
[input_shaper]
shaper_type: mzv

#####################################################################
#   Bed Heater
#####################################################################
##  SSR Pin - Z board, Fan Pin
[heater_bed]
heater_pin: z:P2.3
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: z:P0.25
max_power: 0.8
min_temp: 0
max_temp: 120

#####################################################################
# 	Chamber Temp
#####################################################################
[thermistor 10k_thermistor]
temperature1: 25
resistance1: 10000
temperature2: 45
resistance2: 4367
temperature3: 75
resistance3: 1480

[temperature_fan chamber]
pin: z:P2.7
max_power: 0.6
shutdown_speed: 0
kick_start_time: 0.5
cycle_time: 0.03
sensor_type: 10k_thermistor
sensor_pin: z:P0.24
min_temp: 0
max_temp: 70
target_temp: 0
max_speed: 1.0
min_speed: 0
control: pid
hardware_pwm: false
pid_Kp: 40
pid_Ki: 0.2
pid_Kd: 0.1
pid_deriv_time: 2.0
gcode_id: C

#####################################################################
#   Fan Control
#####################################################################
##  Controller fan - Z board, HE1 Connector
[heater_fan controller_fan]
pin: z:P2.4
max_power: 1.0        # BJD 9/16/2020 quiet these down but keep enough airflow to cool the steppers
cycle_time: 0.025     # 0.03 # BJD 9/16/2020 seems to be a god compromise with this speed to minimize whining defailt is 0.010
kick_start_time: 0.5
heater: heater_bed
heater_temp: 45.0
fan_speed: 0.25       # 0.2 #BJD 9/16/2020 quiet these down but keep enough airflow to cool the steppers
shutdown_speed: 1

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 100

# Note: temperature_mcu is NOT supported on lpc1769 (per
# vendor/klipper/klippy/extras/temperature_mcu.py — only rp2, sam3/4,
# samd21/51, stm32f/g/l/h7 are supported). So we cannot add die-temp
# sensors for the two SKR 1.4 boards. The Eddy MCU temp sensor at
# [temperature_sensor btt_eddy_mcu] in config/eddy.cfg works because
# the BTT Eddy is an RP2040.

#####################################################################
#   LED Control
#####################################################################
# Chamber Lighting - Bed Connector (Optional)
[output_pin caselight]
pin: P2.5
pwm: True
shutdown_value: 0
value: 0
cycle_time: 0.001

#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################
[idle_timeout]
# custom used in andrew ellis' profile. default is just "timeout: 1800"
gcode:
    {% if "xyz" in printer.toolhead.homed_axes %}
        G91                                                                                                 ; relative positioning
        G1 Z5 F18000.0                                                                                      ; move up 5mm
        G90                                                                                                 ; absolute positioning
        G1 X{printer.toolhead.axis_maximum.x} Y{printer.toolhead.axis_maximum.y} F18000.0                   ; park nozzle at rear
    {% endif %}
    OFF                                                                                                     ; turn everything off                                                                                     ; set logo back to white
timeout: 7200 ; 2 hrs

[quad_gantry_level]
gantry_corners:
	-60, 5
	410, 425
points:
	50, 25
	50, 275
	300, 275
	300, 25
speed: 450
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.05
max_adjust: 10

#####################################################################
#   Displays
#####################################################################
# BJD 9/8/2020 per https://discord.com/channels/460117602945990666/460172848565190667/724803977790750750
# Code for mini12864 display on SKR1.4
[board_pins]
aliases:
    # EXP1 header
    EXP1_1=P1.30, EXP1_3=P1.18, EXP1_5=P1.20, EXP1_7=P1.22, EXP1_9=<GND>,
    EXP1_2=P0.28, EXP1_4=P1.19, EXP1_6=P1.21, EXP1_8=P1.23, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=P0.17, EXP2_3=P3.26, EXP2_5=P3.25, EXP2_7=P1.31, EXP2_9=<GND>,
    EXP2_2=P0.15, EXP2_4=P0.16, EXP2_6=P0.18, EXP2_8=<RST>, EXP2_10=<NC>

[display]
lcd_type: uc1701
cs_pin: EXP1_3
a0_pin: EXP1_4
rst_pin: EXP1_5
contrast: 63
encoder_pins: ^EXP2_5, ^EXP2_3
click_pin: ^!EXP1_2
display_group: __voron_display
menu_timeout: 60

[output_pin beeper]
pin: EXP1_1

# fysetc_mini12864
[neopixel lcd]
pin: EXP1_6
chain_count: 3
color_order: RGB
initial_RED: 0.4 ;0.0
initial_GREEN: 0.4 ;0.0
initial_BLUE: 0.4 ; 0.0

#####################################################################
#   File includes
#####################################################################
# MCU + hardware
[include toolhead.cfg]

# Probe + bed leveling + homing override
[include eddy.cfg]

# MMU (Happy Hare)
[include mmu/base/*.cfg]
[include mmu/optional/client_macros.cfg]
[include mmu/optional/mmu_menu.cfg]
[include mmu/addons/blobifier.cfg]

# Client (Mainsail + timelapse)
[include mainsail.cfg]
[include timelapse.cfg]

# Macros
[include macros/macros.cfg]
[include macros/test_speed.cfg]
[include macros/lcd_tweaks.cfg]
[include macros/bedfans.cfg]
[include macros/print_start.cfg]
[include macros/calibrate_flow.cfg]
[include macros/calibrate_pa.cfg]

