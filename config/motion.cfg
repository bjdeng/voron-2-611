## Motion subsystem.
##
## - [printer]                     CoreXY kinematics + global velocity/accel/SCV
## - [stepper_x] + [tmc2209 stepper_x]
## - [stepper_y] + [tmc2209 stepper_y]
## - [stepper_z*] + [tmc2209 stepper_z*]  (4 Z motors: front-left, rear-left,
##                                          rear-right, front-right)
## - [input_shaper]                Per-axis resonance compensation (values in
##                                 SAVE_CONFIG block in printer.cfg)
##
## Note: [gcode_arcs] is already enabled via config/macros/calibrate_flow.cfg
## (Frix_x v1.6 bundles it at resolution=0.1). Don't add a second section here
## or Klipper will refuse to start with a duplicate-section error.

[printer]
kinematics: corexy
max_velocity: 450
max_accel: 10000
minimum_cruise_ratio: 0.5    # this is the klipper default
max_z_velocity: 100			 # Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350   			 # Max ?
square_corner_velocity: 5.0  # Can experiment with 8.0, default 5.0

#####################################################################
#   X/Y Stepper Settings
#####################################################################
##  Connected to X on mcu_xye (B Motor)
[stepper_x]
step_pin: P2.2
dir_pin: !P2.6
enable_pin: !P2.1
rotation_distance: 40
microsteps: 128
full_steps_per_rotation: 200
endstop_pin: ^EBB:gpio13
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 80
second_homing_speed: 15
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: P1.10
interpolate: False
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##  Connected to Y on mcu_xye (A Motor)
[stepper_y]
step_pin: P0.19
dir_pin: !P0.20
enable_pin: !P2.8
rotation_distance: 40
microsteps: 128
full_steps_per_rotation:200
endstop_pin: P1.29
position_min: 0
position_endstop: 355
position_max: 355
homing_speed: 80
second_homing_speed: 15
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: P1.9
interpolate: False
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
#   Z Stepper Settings
#####################################################################
## Z MCU - In X Position
## Z0 Stepper - Front Left
[stepper_z]
step_pin: z:P2.2
dir_pin: !z:P2.6
enable_pin: !z:P2.1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 128
endstop_pin: probe:z_virtual_endstop
position_max: 330
position_min: -5
homing_speed: 15.0
second_homing_speed: 3.0
homing_retract_dist: 2.0

[tmc2209 stepper_z]
uart_pin: z:P1.10
interpolate: False
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z MCU - In Y Position
##  Z1 Stepper - Rear Left
[stepper_z1]
step_pin: z:P0.19
dir_pin: z:P0.20
enable_pin: !z:P2.8
rotation_distance: 40
gear_ratio: 80:16
microsteps: 128

[tmc2209 stepper_z1]
uart_pin: z:P1.9
interpolate: False
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z MCU - In Z Position
##  Z2 Stepper - Rear Right
[stepper_z2]
step_pin: z:P0.22
dir_pin: !z:P2.11
enable_pin: !z:P0.21
rotation_distance: 40
gear_ratio: 80:16
microsteps: 128

[tmc2209 stepper_z2]
uart_pin: z:P1.8
interpolate: False
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z MCU - In E0 Position
##  Z3 Stepper - Front Right
[stepper_z3]
step_pin: z:P2.13
dir_pin: z:P0.11
enable_pin: !z:P2.12
rotation_distance: 40
gear_ratio: 80:16
microsteps: 128

[tmc2209 stepper_z3]
uart_pin: z:P1.4
interpolate: False
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
# 	Input Shaping
#####################################################################
[input_shaper]
shaper_type: mzv
