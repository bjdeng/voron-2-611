## Motion subsystem.
##
## - [printer]                     CoreXY kinematics + global velocity/accel/SCV
## - [stepper_x] + [tmc2209 stepper_x]
## - [stepper_y] + [tmc2209 stepper_y]
## - [stepper_z*] + [tmc2209 stepper_z*]  (4 Z motors: front-left, rear-left,
##                                          rear-right, front-right)
## - [input_shaper]                Per-axis resonance compensation (values in
##                                 SAVE_CONFIG block in printer.cfg)
##
## Note: [gcode_arcs] is already enabled via config/macros/calibrate_flow.cfg
## (Frix_x v1.6 bundles it at resolution=0.1). Don't add a second section here
## or Klipper will refuse to start with a duplicate-section error.

[printer]
kinematics: corexy
max_velocity: 450
max_accel: 10000
minimum_cruise_ratio: 0.5    # this is the klipper default
max_z_velocity: 100			 # Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 1600              # Needs ≥1550 for `SHAPER_CALIBRATE AXIS=Z`
                               # (max_freq_z=100 × accel_per_hz_z=15 + headroom).
                               # Was 350 — bumped 2026-05-20 for Z shaper cal.
square_corner_velocity: 5.0  # Can experiment with 8.0, default 5.0

#####################################################################
#   X/Y Stepper Settings
#####################################################################
##  Connected to X on mcu_xye (B Motor)
[stepper_x]
step_pin: P2.2
dir_pin: !P2.6
enable_pin: !P2.1
rotation_distance: 40
microsteps: 128
full_steps_per_rotation: 200
endstop_pin: ^EBB:gpio13
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 80
second_homing_speed: 15
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: P1.10
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##  Connected to Y on mcu_xye (A Motor)
[stepper_y]
step_pin: P0.19
dir_pin: !P0.20
enable_pin: !P2.8
rotation_distance: 40
microsteps: 128
full_steps_per_rotation:200
endstop_pin: P1.29
position_min: 0
position_endstop: 355
position_max: 355
homing_speed: 80
second_homing_speed: 15
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: P1.9
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
#   Z Stepper Settings
#####################################################################
## Z MCU - In X Position
## Z0 Stepper - Front Left
[stepper_z]
step_pin: z:P2.2
dir_pin: !z:P2.6
enable_pin: !z:P2.1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 128
endstop_pin: probe:z_virtual_endstop
position_max: 330
position_min: 0
homing_speed: 15.0
second_homing_speed: 3.0
homing_retract_dist: 2.0

[tmc2209 stepper_z]
uart_pin: z:P1.10
interpolate: True
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z MCU - In Y Position
##  Z1 Stepper - Rear Left
[stepper_z1]
step_pin: z:P0.19
dir_pin: z:P0.20
enable_pin: !z:P2.8
rotation_distance: 40
gear_ratio: 80:16
microsteps: 128

[tmc2209 stepper_z1]
uart_pin: z:P1.9
interpolate: True
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z MCU - In Z Position
##  Z2 Stepper - Rear Right
[stepper_z2]
step_pin: z:P0.22
dir_pin: !z:P2.11
enable_pin: !z:P0.21
rotation_distance: 40
gear_ratio: 80:16
microsteps: 128

[tmc2209 stepper_z2]
uart_pin: z:P1.8
interpolate: True
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z MCU - In E0 Position
##  Z3 Stepper - Front Right
[stepper_z3]
step_pin: z:P2.13
dir_pin: z:P0.11
enable_pin: !z:P2.12
rotation_distance: 40
gear_ratio: 80:16
microsteps: 128

[tmc2209 stepper_z3]
uart_pin: z:P1.4
interpolate: True
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
# 	Input Shaping
#####################################################################
# Per-axis shapers recommended by klippain-shaketune AXES_SHAPER_CALIBRATION
# 2026-05-20 (issue #25 re-tune session). Both spectrograms were clean.
# X: EI @ 63.0 Hz wins on a tie-break vs MZV @ 49.6 Hz (0.8% vs 1.0%
# residual vibrations at near-identical max_accel ~7220).
# Y: MZV @ 37.0 Hz replaces the prior ZV @ 37.4 Hz — order-of-magnitude
# vibration improvement (0.6% vs 6.1%) at the cost of smoothing 0.150
# (above default 0.094 budget). With [printer] max_accel=10000 in firmware,
# Y will exceed the smoothing budget on extrusion moves; the slicer caps
# extrusion accel below ~5150 to keep smoothing within tolerance. Travel
# moves don't lay plastic so smoothing on travel is invisible.
# Damping ratios measured by shaketune (X: 0.052, Y: 0.063) — Klipper
# default is 0.100; the lower measured values give marginally better fits.
[input_shaper]
shaper_type_x: ei
shaper_freq_x: 63.0
damping_ratio_x: 0.052
shaper_type_y: mzv
shaper_freq_y: 37.0
damping_ratio_y: 0.063
# Z: from Klipper's native `SHAPER_CALIBRATE AXIS=Z` 2026-05-20 (shaketune
# doesn't cover Z). 2HUMP_EI @ 69.6 Hz wins decisively — 0.1% residual
# vibrations vs 3.0% (MZV) / 5.1% (EI) / 20.7% (ZV). Smoothing 0.117 is
# higher than X/Y picks but Z moves don't need tight cornering and
# max_z_accel=1600 stays well below the shaper's 5100 ceiling. 2HUMP_EI
# being optimal hints at a "wide" Z resonance characteristic (typical
# Voron-2 4-belt gantry-Z system), not a mechanical problem. Klipper
# doesn't compute damping_ratio_z — defaults to 0.100.
shaper_type_z: 2hump_ei
shaper_freq_z: 69.6

#####################################################################
#   TMC Autotune (per-motor chopper tuning)
#####################################################################
# Per-stepper [autotune_tmc] blocks for klippain_tmc_autotune. Computes
# optimal TMC2209 chopper parameters (TOFF, TBL, HEND, HSTRT, PWM_FREQ,
# PWM_GRAD) from motor specs in the vendored motor_database.cfg and
# applies them via TMC UART at startup. Motor: 17HS19-2004S1 on X/Y/Z;
# entry `omc-17hs19-2004s1` matches (1.4Ω, 3 mH, 0.59 N·m, 2 A).
# voltage: 24V matches the SKR 1.4 supply.
#
# Z override: tuning_goal:performance (not the default `auto` which picks
# silent/stealthChop on Z). Matches the EricZimmerman/Voron24 pattern and
# addresses upstream issue #141 (Z stealthChop noise on slow probe moves).
# Klipper docs note stealthChop introduces ~75% full-step positional lag
# during constant velocity, which would degrade Z probing accuracy. The
# tradeoff is slightly more chopper heat on Z motors (0.6 A run_current,
# well below the 1.2 A overheating threshold).
#
# X/Y extra_hysteresis:2: bumps chopper hstrt from 4 → 6 to reduce
# low/mid-speed audible hum without changing modes (still spreadCycle).
# Found empirically 2026-05-20 via runtime AUTOTUNE_TMC EXTRA_HYSTERESIS
# experimentation — recovered noise to original baseline after autotune
# defaults made things louder. Per upstream README, use the lowest value
# that helps; 2 was sufficient.

[autotune_tmc stepper_x]
motor: omc-17hs19-2004s1
voltage: 24
extra_hysteresis: 2

[autotune_tmc stepper_y]
motor: omc-17hs19-2004s1
voltage: 24
extra_hysteresis: 2

[autotune_tmc stepper_z]
motor: omc-17hs19-2004s1
voltage: 24
tuning_goal: performance

[autotune_tmc stepper_z1]
motor: omc-17hs19-2004s1
voltage: 24
tuning_goal: performance

[autotune_tmc stepper_z2]
motor: omc-17hs19-2004s1
voltage: 24
tuning_goal: performance

[autotune_tmc stepper_z3]
motor: omc-17hs19-2004s1
voltage: 24
tuning_goal: performance

#####################################################################
#   CRT chopper overrides — applied AFTER autotune at startup
#####################################################################
# Runtime-validated TMC2209 chopper register values from a
# chopper-resonance-tuner session on 2026-05-20. The autotune blocks
# above still write their full set of registers (CoolStep, PWM,
# IHOLDDELAY, multistep_filt, etc.) at handle_connect; this
# delayed_gcode fires 1 second later and overrides only the chopper
# fields where CRT measured a meaningfully different optimum.
#
# Empirical findings (FIND_VIBRATIONS + register sweep, AXIS=x at 40 and
# 79 mm/s, AXIS=z at 6 mm/s; toolhead-mounted LIS2DW):
#   - TOFF=4 wins decisively across all 6 steppers (autotune wrote 1).
#     Same combo is top-3 of 128 at the Z primary peak (6 mm/s),
#     within 1% of the absolute Z optimum.
#   - HSTRT=7 wins on X/Y (autotune wrote 6); HSTRT=7 also matches
#     autotune for Z.
#   - HEND=5 wins on all 6 (autotune wrote 3).
#   - TBL stays at 1 (already optimal per CRT and matches autotune).
#
# Validation: Ben rated 13/15 X/Y/diagonal speeds (40-200 mm/s) as
# quieter or equal vs autotune-aligned baseline (3/5 on the
# established noise scale). Diagonal motion improved at every tested
# speed. Z unchanged audibly (matches CRT's ~3% predicted improvement
# at the Z peak — below audible threshold).
#
# Reference: docs/superpowers/specs/2026-05-20-chopper-resonance-tuner-design.md
# Tuning record: memory/tuning-log.md entry of same date.

[delayed_gcode _apply_crt_chopper]
initial_duration: 1.0
gcode:
  SET_TMC_FIELD STEPPER=stepper_x FIELD=TOFF VALUE=4
  SET_TMC_FIELD STEPPER=stepper_x FIELD=HSTRT VALUE=7
  SET_TMC_FIELD STEPPER=stepper_x FIELD=HEND VALUE=5
  SET_TMC_FIELD STEPPER=stepper_y FIELD=TOFF VALUE=4
  SET_TMC_FIELD STEPPER=stepper_y FIELD=HSTRT VALUE=7
  SET_TMC_FIELD STEPPER=stepper_y FIELD=HEND VALUE=5
  SET_TMC_FIELD STEPPER=stepper_z FIELD=TOFF VALUE=4
  SET_TMC_FIELD STEPPER=stepper_z FIELD=HEND VALUE=5
  SET_TMC_FIELD STEPPER=stepper_z1 FIELD=TOFF VALUE=4
  SET_TMC_FIELD STEPPER=stepper_z1 FIELD=HEND VALUE=5
  SET_TMC_FIELD STEPPER=stepper_z2 FIELD=TOFF VALUE=4
  SET_TMC_FIELD STEPPER=stepper_z2 FIELD=HEND VALUE=5
  SET_TMC_FIELD STEPPER=stepper_z3 FIELD=TOFF VALUE=4
  SET_TMC_FIELD STEPPER=stepper_z3 FIELD=HEND VALUE=5
