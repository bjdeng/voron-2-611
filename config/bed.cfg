## Bed + chamber thermal subsystem.
##
## - [heater_bed]                  SSR-driven bed heater (z:P2.3). PID values
##                                 live in printer.cfg's SAVE_CONFIG block.
## - [thermistor 10k_thermistor]   Defines the chamber thermistor type
##                                 (custom T/R calibration table). Klipper
##                                 requires the thermistor be parsed before
##                                 its consumer ([heater_generic chamber]);
##                                 co-located here for simplicity.
## - [heater_generic chamber]      Chamber heater = BedFans via PID (z:P2.5,
##                                 thermistor z:P0.24). max_temp 70 = sensor
##                                 shutdown ceiling.
## - [fan_generic chamber_exhaust] VEFACH carbon exhaust on z:P2.7. Run by
##                                 PRINT_END / _CANCEL_PRINT_HOOK for the end-of-
##                                 print cooldown (active cooling + VOC evac).
##                                 Also manual via SET_FAN_SPEED.
## - [heater_fan controller_fan]   Electronics-bay fan, triggered by
##                                 heater: heater_bed at 45 °C. Semantically
##                                 slaved to the bed → lives here, not in system.cfg.
## - [quad_gantry_level]           Pre-print Z leveling. The QUAD_GANTRY_LEVEL
##                                 macro override (2-pass, intentional —
##                                 see memory/qgl-two-pass-intentional.md)
##                                 lives in eddy.cfg.

#####################################################################
#   Bed Heater
#####################################################################
##  SSR Pin - Z board, Fan Pin
[heater_bed]
heater_pin: z:P2.3
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: z:P0.25
max_power: 0.8
min_temp: 0
max_temp: 120

#####################################################################
# 	Chamber Temp
#####################################################################
[thermistor 10k_thermistor]
temperature1: 25
resistance1: 10000
temperature2: 45
resistance2: 4367
temperature3: 75
resistance3: 1480

# Chamber heater = BedFans recirculation via [heater_generic chamber] (PID).
# Replaces the prior [temperature_fan chamber] auto-PID exhaust. Drives BedFans
# (z:P2.5 — was [fan_generic BedFans] in macros/bedfans.cfg) using the chamber
# thermistor (z:P0.24) as feedback. Single PID controller for the whole chamber
# system; no race between heater and exhaust because there is no exhaust auto-
# controller anymore. Spec: docs/superpowers/specs/2026-05-22-chamber-heater-generic-pid.md
[heater_generic chamber]
gcode_id: C
heater_pin: z:P2.5
sensor_type: 10k_thermistor
sensor_pin: z:P0.24
# control / pid_Kp / pid_Ki / pid_Kd are managed by Klipper's SAVE_CONFIG
# block in printer.cfg, populated by PID_CALIBRATE HEATER=chamber TARGET=55.
# Standard Klipper convention — same pattern as heater_bed + extruder PIDs.
# Leaving them out of the body avoids the "option conflicts with included
# value" error on SAVE_CONFIG after future re-cals.
max_power: 1.0
min_temp: 0
max_temp: 70                                # sensor-shutdown ceiling; chamber_max_target (60) is the user setpoint cap
pwm_cycle_time: 0.05                        # 20 Hz, matches prior fan_generic default
smooth_time: 5.0                            # smooths the temperature signal over 5s before PID computes derivative — suppresses BedFans speed jitter that Kd=2849 would otherwise amplify from thermal noise. Klipper default is 1.0s. Increase if BedFans audibly hunt; decrease if temperature control becomes sluggish.

# Effectively-disabled verify_heater. The "heater" here is BedFans circulating
# bed air — it can't thermal-runaway like a resistive element, and "fails to
# reach/hold target" is NORMAL: the only heat source is the bed, so the chamber
# can plateau below target during a print (passive bed radiation only) or while
# the bed cools through the PRINT_END cooldown G4. Neither is a fault. The real
# overtemp guard is [heater_generic chamber] max_temp = 70 above — that still
# fires. Setting the windows absurdly high makes the gain/error checks never
# fire. (Folds in PR #116.)
[verify_heater chamber]
max_error: 99999                            # fan can't runaway; don't shut down on accumulated error
check_gain_time: 99999                      # fan-heater legitimately can't always reach target; never treat that as a fault
heating_gain: 1
hysteresis: 5

# Chamber exhaust fan: VEFACH carbon filter, exhaust-to-room. Run automatically
# by PRINT_END / _CANCEL_PRINT_HOOK for the end-of-print cooldown window (active
# cooling + VOC evacuation), decoupled from the BedFans (which own chamber
# heating + in-print VOC recirc through the under-bed filter). Also available for
# manual SET_FAN_SPEED FAN=chamber_exhaust SPEED=N.
# Spec: docs/superpowers/specs/2026-06-03-vefach-exhaust-cooldown-decouple.md
[fan_generic chamber_exhaust]
pin: z:P2.7
kick_start_time: 0.5

#####################################################################
#   Fan Control
#####################################################################
##  Controller fan - Z board, HE1 Connector
[heater_fan controller_fan]
pin: z:P2.4
max_power: 1.0        # BJD 9/16/2020 quiet these down but keep enough airflow to cool the steppers
cycle_time: 0.025     # 0.03 # BJD 9/16/2020 seems to be a god compromise with this speed to minimize whining defailt is 0.010
kick_start_time: 0.5
heater: heater_bed
heater_temp: 45.0
fan_speed: 0.25       # 0.2 #BJD 9/16/2020 quiet these down but keep enough airflow to cool the steppers
shutdown_speed: 1

#####################################################################
#   Quad Gantry Level
#####################################################################
[quad_gantry_level]
gantry_corners:
	-60, 5
	410, 425
points:
	50, 25
	50, 275
	300, 275
	300, 25
speed: 450
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.05
max_adjust: 10
